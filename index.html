<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Run Plan</title>
<meta name="theme-color" content="#0a0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Run Plan">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<style>
:root{
  --bg:#0a0c10; --surface:#151920; --surface2:#1d232d; --line:#2b333f;
  --text:#f3f6fa; --muted:#95a1b4; --dim:#6b7688;
  --accent:#3ce08c; --accent-dim:#1d6b45;
  --planned:#333e4e;
  --warn:#ffb03a; --danger:#ff5f5f; --recovery:#5ea8ff;
  --easy:#3ce08c; --moderate:#ffb03a; --hard:#ff5f5f;
  --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}

#view{
  padding:14px 14px calc(96px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
}
/* Cards arriving all at once reads as a flash; a short stagger reads as a page. */
@media (prefers-reduced-motion:no-preference){
  #view.anim>*{animation:rise .26s cubic-bezier(.22,.9,.3,1) both}
  #view.anim>*:nth-child(2){animation-delay:.03s}
  #view.anim>*:nth-child(3){animation-delay:.06s}
  #view.anim>*:nth-child(n+4){animation-delay:.09s}
}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.topbar{
  padding:calc(10px + env(safe-area-inset-top)) 14px 6px;
  max-width:640px;margin:0 auto;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
.topbar h1{font-size:19px}
.topbar .sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,0)) var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
.card.recovery{border-color:var(--recovery);background:linear-gradient(180deg,rgba(94,168,255,.10),rgba(94,168,255,.02))}
.label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- today hero ---------- */
.hero .when{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.hero{position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;top:-70px;right:-70px;width:200px;height:200px;
  background:radial-gradient(circle,rgba(60,224,140,.13),transparent 68%);pointer-events:none;
}
.hero .dist{font-size:66px;line-height:1;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.hero .dist span{font-size:24px;font-weight:700;color:var(--muted);margin-left:4px;letter-spacing:0}
.hero .countdown{margin-top:10px;font-size:15px;color:var(--muted)}
.hero .countdown b{color:var(--text)}
.badge{
  display:inline-block;padding:4px 10px;border-radius:999px;
  font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
}
.badge.rec{background:rgba(94,168,255,.16);color:var(--recovery);border:1px solid rgba(94,168,255,.4)}
.badge.today{background:rgba(60,224,140,.16);color:var(--accent);border:1px solid rgba(60,224,140,.4)}
.badge.peak{background:rgba(255,95,95,.14);color:var(--danger);border:1px solid rgba(255,95,95,.4)}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:var(--tap);border-radius:14px;
  font-weight:700;font-size:17px;background:var(--surface2);
  border:1px solid var(--line);padding:0 16px;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:#06210f;border-color:var(--accent);min-height:62px;font-size:19px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(255,95,95,.4)}
.btn[disabled]{opacity:.4}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1}

/* ---------- weekly strip ---------- */
.stats-row{display:flex;gap:10px}
.stat{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,0)) var(--surface);
}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-top:3px}
.bar{height:10px;border-radius:6px;background:var(--planned);overflow:hidden;margin-top:10px}
.bar>i{
  display:block;height:100%;border-radius:6px;transition:width .45s cubic-bezier(.22,.9,.3,1);
  background:linear-gradient(90deg,var(--accent-dim),var(--accent));
}
.bar>i.over{background:linear-gradient(90deg,#a86a12,var(--warn))}

/* ---------- banners ---------- */
.banner{
  border-radius:14px;padding:13px 14px;margin-bottom:12px;
  font-size:14px;line-height:1.4;border:1px solid;
  display:flex;gap:11px;align-items:flex-start;
}
.banner .ico{font-size:17px;line-height:1.2}
.banner b{display:block;margin-bottom:2px;font-size:14px}
.banner.warn{background:rgba(255,176,58,.11);border-color:rgba(255,176,58,.42);color:#ffd699}
.banner.danger{background:rgba(255,95,95,.11);border-color:rgba(255,95,95,.42);color:#ffbdbd}
.banner.info{background:rgba(94,168,255,.11);border-color:rgba(94,168,255,.42);color:#c2ddff}
.banner .act{
  margin-top:10px;display:block;width:100%;min-height:46px;border-radius:11px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);
  font-weight:700;font-size:15px;color:inherit;
}

/* ---------- run rows ---------- */
.runs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.run{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:60px;padding:11px 12px;border-radius:14px;
  background:var(--surface2);border:1px solid transparent;
  transition:transform .12s ease, border-color .2s ease;
}
.run:active{transform:scale(.99)}
.run.done{border-color:rgba(60,224,140,.18)}
.run.is-today{border-color:var(--accent);box-shadow:0 0 0 3px rgba(60,224,140,.10)}
.run .dot{width:11px;height:11px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.run.done .dot{background:var(--accent)}
.run.skipped .dot{background:var(--danger)}
.run .day{width:34px;font-weight:800;font-size:14px;flex:0 0 auto}
.run .date{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.run .mid{flex:1;min-width:0}
.run .km{font-weight:800;font-variant-numeric:tabular-nums;font-size:17px;text-align:right}
.run .km small{display:block;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.02em}
.run .pain{color:var(--danger);font-size:11px;font-weight:700;margin-top:3px}
.run .eff{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle}

/* A run carries five or six numbers. As a run-on sentence of middots they are
   unreadable; as value+unit pairs the eye can jump straight to the one it
   wants, and the strip wraps instead of overflowing. */
.mets{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px}
.mets em{
  font-style:normal;font-weight:700;font-size:13px;
  font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap;
}
.mets em i{font-style:normal;font-weight:600;font-size:11px;color:var(--dim)}

/* ---------- week list ---------- */
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.wk-head .t{font-size:17px;font-weight:800}
.wk-head .d{font-size:12px;color:var(--muted);font-weight:600}
.wk-nums{text-align:right;font-variant-numeric:tabular-nums}
.wk-nums .a{font-size:17px;font-weight:800}
.wk-nums .p{font-size:12px;color:var(--muted)}
.wk-body{display:none}
.wk.open .wk-body{display:block}
.wk.current{border-color:var(--accent)}

/* ---------- chart ---------- */
.chart{width:100%;height:210px;display:block;touch-action:manipulation}
/* The bars are painted over the tap targets, so without this they swallow the
   tap and the most natural place to press — the bar itself — does nothing. */
.chart>*{pointer-events:none}
.chart .hit{pointer-events:auto;cursor:pointer}
.legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.readout{
  margin-top:12px;padding:11px 12px;border-radius:12px;
  background:var(--surface2);border:1px solid var(--line);
}
.readout .rh{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-size:14px;font-weight:800;margin-bottom:7px;
}
.readout .rd{font-size:12px;font-weight:600;color:var(--muted)}
.readout .mets{margin-top:0}
.readout .mets em.good{color:var(--accent)}
.readout .mets em.over{color:var(--warn)}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;background:rgba(10,12,16,.93);
  backdrop-filter:saturate(150%) blur(14px);
  -webkit-backdrop-filter:saturate(150%) blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--surface);border-radius:22px 22px 0 0;
  border-top:1px solid var(--line);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px 14px calc(20px + env(safe-area-inset-bottom));
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 14px}
.sheet h2{font-size:21px;margin-bottom:3px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.field{margin-bottom:16px}
.field>.label{display:block;margin-bottom:8px}
.seg{display:flex;gap:8px}
.seg button{
  flex:1;min-height:var(--tap);border-radius:13px;border:1.5px solid var(--line);
  background:var(--surface2);font-weight:700;font-size:16px;
}
.seg button.on{background:var(--accent);color:#06210f;border-color:var(--accent)}
.seg button.on[data-v=skipped]{background:var(--danger);color:#2a0000;border-color:var(--danger)}
.seg button.on[data-v=easy]{background:var(--easy);color:#06210f;border-color:var(--easy)}
.seg button.on[data-v=moderate]{background:var(--moderate);color:#241500;border-color:var(--moderate)}
.seg button.on[data-v=hard]{background:var(--hard);color:#2a0000;border-color:var(--hard)}

/* ---- day picker: seven tap targets, so it has to stay compact ---- */
.days{display:flex;gap:5px}
.days button{
  flex:1;min-height:44px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--surface2);font-weight:700;font-size:13px;padding:0;
}
.days button.on{background:var(--accent);color:#06210f;border-color:var(--accent)}
.days button.busy{opacity:.32}

/* ---- one editable run: day, distance, remove ---- */
.rowedit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.rowedit select{
  min-height:var(--tap);border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface2);color:var(--text);font-weight:700;font-size:15px;
  padding:0 8px;flex:0 0 88px;
}
.rowedit .inp{flex:1}
/* the column header already says km — repeating it per row doubles the height */
.rowedit .inp .u{display:none}
.rowedit .x{
  flex:0 0 var(--tap);min-height:var(--tap);border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface2);
  color:var(--danger);font-size:22px;line-height:1;
}
.rowedit .lg{color:var(--accent);font-size:12px;margin-left:-4px}
.btn.sm{min-height:42px;font-size:14px}
.xs{
  min-width:30px;min-height:30px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface2);color:var(--danger);font-size:16px;line-height:1;padding:0;
}

/* ---- breakdown tables ---- */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
.tbl th,.tbl td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.dim{color:var(--muted)}
.tbl tr.cur td{background:rgba(60,224,140,.07)}
.tbl td.good{color:var(--accent);font-weight:700}
.tbl td.over{color:var(--warn);font-weight:700}
.tbl .sk{color:var(--danger);font-size:11px}
.tbl tbody tr:last-child td{border-bottom:none}
.dotm{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:middle}
.dotm.rc{background:var(--recovery)}
.dotm.pk{background:var(--warn)}

.inputs{display:flex;gap:10px;align-items:flex-end}
.inp{flex:1}
.inp input{
  width:100%;min-height:var(--tap);border-radius:13px;border:1.5px solid var(--line);
  background:var(--surface2);padding:0 14px;font-size:22px;font-weight:700;
  font-variant-numeric:tabular-nums;text-align:center;
}
.inp input:focus{outline:none;border-color:var(--accent)}
.inp .u{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{
  min-height:46px;padding:0 15px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface2);font-weight:600;font-size:15px;
}
.chips button.on{background:var(--danger);color:#2a0000;border-color:var(--danger);font-weight:800}
textarea{
  width:100%;min-height:88px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--surface2);padding:12px 14px;font-size:16px;resize:vertical;
}
textarea:focus{outline:none;border-color:var(--accent)}
.pace{
  text-align:center;font-size:14px;color:var(--muted);margin-top:-6px;margin-bottom:14px;
  font-variant-numeric:tabular-nums;min-height:20px;
}
.pace b{color:var(--accent);font-size:16px}
.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}

/* ---------- import preview ---------- */
.imp{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 12px;border-radius:13px;background:var(--surface2);
  border:1.5px solid transparent;margin-bottom:8px;
}
.imp.on{border-color:var(--accent)}
.imp.conflict{border-color:var(--warn)}
.imp .tick{
  width:24px;height:24px;border-radius:7px;flex:0 0 auto;
  border:2px solid var(--dim);display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;color:#06210f;
}
.imp.on .tick{background:var(--accent);border-color:var(--accent)}
.imp .mid{flex:1;min-width:0}
.imp .a{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.imp .b{font-size:12px;color:var(--muted);margin-top:2px}
.imp .b.warnt{color:var(--warn)}
.imp .b.badt{color:var(--danger)}
.drop{
  border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;
  color:var(--muted);font-size:14px;margin-bottom:12px;
}
.drop.over{border-color:var(--accent);color:var(--accent)}
.tiny{font-size:12px;color:var(--dim);line-height:1.5;margin-top:10px}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="title">Today</h1>
  <div class="sub" id="subtitle"></div>
</div>

<main id="view"></main>

<nav class="tabbar">
  <button data-tab="today" class="on">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Today
  </button>
  <button data-tab="plan">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Plan
  </button>
  <button data-tab="stats">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats
  </button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<input type="file" id="fileIn" class="hidden" accept=".tcx,.gpx,.xml,.json,.csv,.txt,text/xml,application/xml,application/json,text/csv,text/plain">

<script>
"use strict";

/* ============================ PLAN ============================ */
/* The plan is editable and lives in storage alongside the logs. What follows
   is only the starting point — used on a first run, and by "Reset the plan".
   Week totals are never stored; they are always summed from the runs, so an
   edited distance cannot drift out of step with its week. */
var DEFAULT_PLAN = [
  { km:[7,7,8],    tag:null },
  { km:[7,8,9],    tag:null },
  { km:[8,8,10],   tag:null },
  { km:[6,6,7],    tag:"RECOVERY" },
  { km:[8,8,10],   tag:null },
  { km:[8,9,11],   tag:null },
  { km:[9,10,11],  tag:null },
  { km:[7,7,8],    tag:"RECOVERY" },
  { km:[9,10,11],  tag:null },
  { km:[10,10,12], tag:null },
  { km:[11,11,12], tag:"PEAK" },
  { km:[8,8,9],    tag:"RECOVERY" }
];
var WEEK1_MONDAY = "2026-08-03";
var DEFAULT_OFFSET = [1, 3, 6];          // Mon+1=Tue, +3=Thu, +6=Sun
var WD_SHORT = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];   // index = days from Monday
var OVER_LIMIT = 1.10;                   // flag above 110% of planned week volume
var PAIN_WINDOW_DAYS = 14;
var MAX_WEEKS = 52;

var AREAS = ["Knee","Shin","Calf","Achilles","Ankle","Foot",
             "Hamstring","Quad","Hip","IT band","Groin","Lower back","Other"];

/* ============================ DATES ============================ */
function parseISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function toISO(d){
  var m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (day<10?"0":"") + day;
}
function addDays(d, n){ var c = new Date(d.getTime()); c.setDate(c.getDate()+n); return c; }
function today(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function dayDiff(a, b){ return Math.round((b - a) / 86400000); }
function fmtDate(d){
  return d.toLocaleDateString(undefined, { month:"short", day:"numeric" });
}
function fmtLong(d){
  return d.toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
}
/* Monday on or before d */
function mondayOf(d){
  var wd = d.getDay();               // 0 Sun .. 6 Sat
  var back = (wd === 0) ? 6 : wd - 1;
  return addDays(d, -back);
}

/* ============================ STATE ============================ */
var KEY = "runplan.v1";
var state = load();
// Write the migrated shape straight back, rather than leaving v1 on disk until
// the next edit — a half-migrated store is the kind of thing that bites later.
if (state.migrated){ delete state.migrated; save(); }

/* Every run carries an id, and logs are stored against that id rather than
   against its position. This is what makes the plan safe to edit: inserting,
   deleting or reordering weeks moves runs around, and under the old
   "week-day" keying every log after the edit would silently re-point to a
   different run. Ids move with the run. */
function freshPlan(){
  var base = parseISO(WEEK1_MONDAY), out = [], n = 0;
  DEFAULT_PLAN.forEach(function(p, i){
    out.push({
      start: toISO(addDays(base, i*7)),
      tag: p.tag,
      runs: p.km.map(function(km, d){ return { id:"r" + (++n), km:km, off:DEFAULT_OFFSET[d] }; })
    });
  });
  return out;
}
function planOK(p){
  return Array.isArray(p) && p.length > 0 && p.every(function(w){
    return w && typeof w.start === "string" && /^\d{4}-\d{2}-\d{2}$/.test(w.start) &&
      Array.isArray(w.runs) && w.runs.every(function(r){
        return r && typeof r.id === "string" && typeof r.km === "number" &&
               r.km >= 0 && r.off >= 0 && r.off <= 6;
      });
  });
}
function maxSeq(p){
  var m = 0;
  (p || []).forEach(function(w){
    (w.runs || []).forEach(function(r){
      var n = parseInt(String(r.id).replace(/^r/, ""), 10);
      if (isFinite(n) && n > m) m = n;
    });
  });
  return m;
}
/* v1 stored weekStarts[] parallel to a hardcoded plan, and logs keyed "w-d".
   Rebuild the default plan, carry the saved week starts across, and re-point
   every log onto the id of the run that slot used to mean. */
function migrateV1(s){
  var plan = freshPlan();
  if (Array.isArray(s.weekStarts)){
    for (var i = 0; i < plan.length && i < s.weekStarts.length; i++)
      if (/^\d{4}-\d{2}-\d{2}$/.test(s.weekStarts[i])) plan[i].start = s.weekStarts[i];
  }
  var logs = {};
  Object.keys(s.logs || {}).forEach(function(k){
    var m = /^(\d+)-(\d+)$/.exec(k);
    if (!m){ logs[k] = s.logs[k]; return; }          // already an id — leave it
    var w = +m[1], d = +m[2];
    if (plan[w] && plan[w].runs[d]) logs[plan[w].runs[d].id] = s.logs[k];
  });
  s.plan = plan;
  s.logs = logs;
  return s;
}
function load(){
  var s = null;
  try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ s = null; }
  if (!s || typeof s !== "object") s = {};
  if (!s.logs || typeof s.logs !== "object") s.logs = {};
  if (!planOK(s.plan)){ s = migrateV1(s); s.migrated = true; }
  if (!s.settings || typeof s.settings !== "object") s.settings = {};
  if (!(s.settings.hrMax > 0))  s.settings.hrMax  = 190;   // edit in Stats
  if (!(s.settings.hrRest > 0)) s.settings.hrRest = 55;
  // Runs that belong to no plan slot — history imported from before the block
  // began, or anything run outside it. Kept apart from state.logs on purpose:
  // see extraLogs().
  if (!Array.isArray(s.extras)) s.extras = [];
  s.seq = Math.max(s.seq || 0, maxSeq(s.plan));
  s.version = 2;
  delete s.weekStarts;                                     // superseded by plan[].start
  return s;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ alert("Could not save — device storage may be full or private browsing is on."); }
}

/* ---------- plan accessors ---------- */
function planLen(){ return state.plan.length; }
function wk(w){ return state.plan[w]; }
function runsOf(w){ return state.plan[w].runs; }
function runAt(w, d){ return state.plan[w].runs[d]; }
function weekStart(w){ return parseISO(state.plan[w].start); }
function weekTotal(w){
  return runsOf(w).reduce(function(a, r){ return a + (r.km || 0); }, 0);
}
function newId(){ state.seq = (state.seq || 0) + 1; return "r" + state.seq; }
function runDate(w, d){ return addDays(weekStart(w), runAt(w, d).off); }
function getLog(w, d){ var r = runAt(w, d); return r ? (state.logs[r.id] || null) : null; }
function setLog(w, d, v){ state.logs[runAt(w, d).id] = v; }
function dayName(w, d){ return WD_SHORT[runAt(w, d).off]; }
/* Keep runs in day order. Safe to call after any edit — logs key on id. */
function sortRuns(w){ runsOf(w).sort(function(a, b){ return a.off - b.off; }); }
/* The longest run of the week, which is what "long run" means here. */
function isLong(w, d){
  var rs = runsOf(w), mx = -1, at = -1;
  rs.forEach(function(r, i){ if (r.km >= mx){ mx = r.km; at = i; } });
  return rs.length > 1 && at === d;
}
function lastRunDate(w){
  var rs = runsOf(w), mx = 6;
  if (rs.length) mx = rs.reduce(function(a, r){ return Math.max(a, r.off); }, 0);
  return addDays(weekStart(w), mx);
}

/* ============================ DERIVED ============================ */
function weekActual(w){
  var sum = 0;
  runsOf(w).forEach(function(r, d){
    var l = getLog(w, d);
    if (l && l.done && typeof l.km === "number") sum += l.km;
  });
  return sum;
}
function weekIsPast(w){
  return dayDiff(lastRunDate(w), today()) > 0;     // after the week's final run
}
function weekIsCurrent(w){
  var t = today(), start = weekStart(w);
  return dayDiff(start, t) >= 0 && dayDiff(t, addDays(start, 6)) >= 0;
}
function currentWeekIndex(){
  for (var w = 0; w < planLen(); w++) if (weekIsCurrent(w)) return w;
  // before the plan starts -> week 1; after it ends -> last week
  if (dayDiff(today(), weekStart(0)) > 0) return 0;
  return planLen() - 1;
}
/* Next run that has not been logged either way */
function nextRun(){
  var t = today();
  for (var w = 0; w < planLen(); w++){
    for (var d = 0; d < runsOf(w).length; d++){
      var l = getLog(w, d);
      if (l && (l.done || l.skipped)) continue;
      if (dayDiff(t, runDate(w, d)) >= 0) return { w:w, d:d };   // today or later
    }
  }
  return null;
}
function rolling4(){
  var c = currentWeekIndex(), a = 0, p = 0;
  for (var w = Math.max(0, c-3); w <= c; w++){ a += weekActual(w); p += weekTotal(w); }
  return { actual:a, planned:p };
}
/* Consecutive completed runs, walking backwards from the last run due */
function streak(){
  var t = today(), slots = [];
  for (var w = 0; w < planLen(); w++)
    for (var d = 0; d < runsOf(w).length; d++)
      if (dayDiff(t, runDate(w, d)) <= 0) slots.push([w, d]);    // already due
  var n = 0;
  for (var i = slots.length - 1; i >= 0; i--){
    var l = getLog(slots[i][0], slots[i][1]);
    if (l && l.done) n++; else break;
  }
  return n;
}
/* Areas with >= 2 pain logs inside the trailing 14 days */
function painFlags(){
  var t = today(), byArea = {};
  Object.keys(state.logs).forEach(function(k){
    var l = state.logs[k];
    if (!l || !l.pain || !l.pain.area || !l.date) return;
    if (dayDiff(parseISO(l.date), t) > PAIN_WINDOW_DAYS) return;   // older than the window
    if (dayDiff(t, parseISO(l.date)) > 0) return;                  // logged ahead of today
    (byArea[l.pain.area] = byArea[l.pain.area] || []).push(l);
  });
  return Object.keys(byArea).filter(function(a){ return byArea[a].length >= 2; })
    .map(function(a){ return { area:a, count:byArea[a].length }; });
}
/* A fully past week with nothing completed */
function missedWeek(){
  for (var w = 0; w < planLen(); w++){
    if (!weekIsPast(w)) return null;               // stop at the first non-past week
    if (!runsOf(w).length) continue;               // an empty week cannot be missed
    var any = false;
    for (var d = 0; d < runsOf(w).length; d++){ var l = getLog(w, d); if (l && l.done) { any = true; break; } }
    if (!any) return w;
  }
  return null;
}
function overWeeks(){
  var out = [];
  for (var w = 0; w < planLen(); w++){
    var a = weekActual(w), p = weekTotal(w);
    if (p > 0 && a > p * OVER_LIMIT) out.push({ w:w, actual:a, planned:p });
  }
  return out;
}
function paceStr(km, sec){
  if (!km || !sec) return "";
  var s = Math.round(sec / km), m = Math.floor(s / 60), r = s % 60;
  return m + ":" + (r < 10 ? "0" : "") + r + " /km";
}
function durStr(sec){
  if (!sec) return "";
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h) return h + ":" + (m<10?"0":"") + m + ":" + (s<10?"0":"") + s;
  return m + ":" + (s<10?"0":"") + s;
}
/* ---------- splits ---------- */
/* Accepts "5:02 4:58 5:10", commas, or raw seconds. Returns sec/km. */
function parseSplits(s){
  if (!s) return null;
  var out = String(s).split(/[,;\s]+/).filter(Boolean).map(function(p){
    if (p.indexOf(":") >= 0){
      var q = p.split(":").map(Number);
      if (q.length === 3) return q[0]*3600 + q[1]*60 + q[2];
      if (q.length === 2 && isFinite(q[0]) && isFinite(q[1])) return q[0]*60 + q[1];
      return NaN;
    }
    return parseFloat(p);
  }).filter(function(v){ return isFinite(v) && v > 60 && v < 1800; });
  return out.length ? out : null;
}
function splitStr(sec){
  var m = Math.floor(sec/60), r = Math.round(sec%60);
  if (r === 60){ m++; r = 0; }
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function splitsToText(a){
  return a ? a.map(splitStr).join(" ") : "";
}

/* ---------- VO2 max estimate ----------
   Pace -> oxygen cost (ACSM/Daniels running equation), then scaled by heart
   rate reserve, since %HRreserve tracks %VO2reserve closely. This is an
   estimate from your own run, not a reading off the watch — Samsung does not
   expose its number to third-party apps. */
function vo2for(l){
  if (!l || !l.done || !(l.km > 0) || !(l.durSec > 0) || !(l.hr > 0)) return null;
  var st = state.settings;
  if (!(st.hrMax > st.hrRest)) return null;
  var v = (l.km * 1000) / (l.durSec / 60);                      // metres per minute
  if (!(v > 60) || v > 500) return null;
  var cost = -4.60 + 0.182258 * v + 0.000104 * v * v;           // ml/kg/min at that pace
  var frac = (l.hr - st.hrRest) / (st.hrMax - st.hrRest);       // heart rate reserve
  if (!(frac > 0.4) || frac > 1.05) return null;                // too easy or over max to be meaningful
  return Math.round(((cost - 3.5) / frac + 3.5) * 10) / 10;
}
/* ---------- runs outside the plan ----------
   History imported from before the block started, or anything run alongside it.
   These sit in state.extras rather than state.logs because they answer to no
   plan slot, and because the plan-adherence machinery must not see them: a run
   from last year should not count towards this week's volume, trip the 110%
   warning, or make a recovery week look overshot. They do count towards
   everything that is simply a record of running — monthly totals, lifetime
   distance, the VO2 trend and average heart rate. */
function extraLogs(){
  return state.extras.filter(function(l){ return l && l.done; });
}
/* Every completed run, plan or not. Sorted by date. */
function allLogs(){
  var out = [];
  Object.keys(state.logs).forEach(function(k){
    var l = state.logs[k]; if (l && l.done) out.push(l);
  });
  extraLogs().forEach(function(l){ out.push(l); });
  return out.sort(function(a, b){ return (a.date || "") < (b.date || "") ? -1 : 1; });
}

/* Oldest first */
function vo2Series(){
  var out = [];
  allLogs().forEach(function(l){
    var v = vo2for(l);
    if (v) out.push({ date:l.date, vo2:v });
  });
  return out.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
}
function avgHR(){
  var hrs = [];
  allLogs().forEach(function(l){ if (l.hr > 0) hrs.push(l.hr); });
  return hrs.length ? Math.round(hrs.reduce(function(a, b){ return a+b; }, 0) / hrs.length) : null;
}

/* ---------- period breakdowns ----------
   One summariser, fed either a week's slots or a calendar month's logs, so
   the two tables cannot drift apart in how they count things. */
function summarise(logs){
  var km = 0, sec = 0, n = 0, hrs = [], vs = [], skip = 0, kcal = 0;
  logs.forEach(function(l){
    if (!l) return;
    if (l.skipped){ skip++; return; }
    if (!l.done) return;
    n++; km += (l.km || 0); sec += (l.durSec || 0); kcal += (l.kcal || 0);
    if (l.hr > 0) hrs.push(l.hr);
    var v = vo2for(l); if (v) vs.push(v);
  });
  return {
    runs:n, km:km, sec:sec, skipped:skip, kcal:kcal,
    hr: hrs.length ? Math.round(hrs.reduce(function(a,b){ return a+b; }, 0) / hrs.length) : null,
    vo2: vs.length ? Math.max.apply(null, vs) : null
  };
}
function weekRows(){
  var out = [];
  for (var w = 0; w < planLen(); w++){
    var ls = runsOf(w).map(function(r, d){ return getLog(w, d); });
    var s = summarise(ls);
    s.w = w; s.planned = weekTotal(w); s.tag = wk(w).tag;
    s.start = weekStart(w); s.end = addDays(weekStart(w), 6);
    out.push(s);
  }
  return out;
}
/* Planned km per calendar month, from where each run actually falls. */
function monthPlanned(){
  var by = {};
  for (var w = 0; w < planLen(); w++)
    runsOf(w).forEach(function(r, d){
      var m = toISO(runDate(w, d)).slice(0, 7);
      by[m] = (by[m] || 0) + (r.km || 0);
    });
  return by;
}
function monthRows(){
  var by = {}, planned = monthPlanned();
  var push = function(l){
    if (!l || !l.date) return;
    var m = String(l.date).slice(0, 7);                  // YYYY-MM
    (by[m] = by[m] || []).push(l);
  };
  Object.keys(state.logs).forEach(function(k){ push(state.logs[k]); });
  state.extras.forEach(push);                            // history counts here
  Object.keys(planned).forEach(function(m){ if (!by[m]) by[m] = []; });
  return Object.keys(by).sort().map(function(m){
    var s = summarise(by[m]);
    var p = m.split("-");
    s.month = m;
    s.planned = planned[m] || 0;
    s.label = new Date(+p[0], +p[1]-1, 1)
      .toLocaleDateString(undefined, { month:"long", year:"numeric" });
    return s;
  });
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function n1(x){ return (Math.round(x * 10) / 10).toString(); }
/* 12,400 kcal will not fit a stat tile; 12.4k will. */
function fmtK(x){
  return x >= 10000 ? (Math.round(x / 100) / 10) + "k" : String(Math.round(x));
}

/* ============================ PLAN EDITS ============================
   Every one of these can move runs between positions. None of them touch
   log keys, because logs are stored against run ids — see freshPlan.
   ==================================================================== */

/* Move week w (and every week after it) so w starts on the next Monday. */
function shiftFrom(w){
  var t = today(), m = mondayOf(t);
  var target = (dayDiff(m, t) === 0) ? m : addDays(m, 7);
  var weeks = Math.round(dayDiff(weekStart(w), target) / 7);
  if (weeks <= 0) weeks = 1;
  for (var i = w; i < planLen(); i++)
    state.plan[i].start = toISO(addDays(weekStart(i), weeks * 7));
  save();
  render();
}

/* Nudge one week, and everything after it, by whole weeks in either
   direction. Used by the per-week "earlier / later" controls. */
function nudgeWeek(w, weeks){
  if (w === 0 && weeks < 0 && dayDiff(addDays(weekStart(0), weeks*7), today()) > 365) return;
  for (var i = w; i < planLen(); i++)
    state.plan[i].start = toISO(addDays(weekStart(i), weeks * 7));
  save(); render();
}

function addWeek(){
  if (planLen() >= MAX_WEEKS){ alert("That is as long as the plan goes."); return; }
  var last = state.plan[planLen()-1];
  state.plan.push({
    start: toISO(addDays(parseISO(last.start), 7)),
    tag: null,
    // mirror the shape of the final week, so a new week is a sane starting point
    runs: last.runs.map(function(r){ return { id:newId(), km:r.km, off:r.off }; })
  });
  save(); render();
}

function deleteWeek(w){
  if (planLen() <= 1){ alert("The plan needs at least one week."); return; }
  var n = 0;
  runsOf(w).forEach(function(r){ if (state.logs[r.id]) n++; });
  if (!confirm("Delete week " + (w+1) +
      (n ? ", including " + n + " logged run" + (n === 1 ? "" : "s") : "") +
      "?\n\nThis cannot be undone.")) return;
  runsOf(w).forEach(function(r){ delete state.logs[r.id]; });
  state.plan.splice(w, 1);
  // pull the later weeks back so the calendar stays tight
  for (var i = w; i < planLen(); i++)
    state.plan[i].start = toISO(addDays(weekStart(i), -7));
  save(); render();
}

function setWeekTag(w, tag){
  wk(w).tag = tag || null;
  save(); render();
}

function setRunKm(w, d, km){
  if (!(km >= 0)) return;
  runAt(w, d).km = Math.round(km * 10) / 10;
  save();
}

/* Move a run to another day of its own week. Keeping it inside the week is
   deliberate: weekly totals stay meaningful, and the recovery and over-volume
   guards keep working. To move further than that, shift the whole week. */
function setRunDay(w, d, off){
  var r = runAt(w, d);
  if (off < 0 || off > 6) return;
  if (runsOf(w).some(function(o){ return o !== r && o.off === off; })){
    alert("There is already a run on that day this week.");
    return false;
  }
  r.off = off;
  var l = state.logs[r.id];
  // an unlogged run follows the schedule; a logged one keeps the date it happened
  if (l && !l.done && !l.skipped) delete state.logs[r.id];
  sortRuns(w);
  save();
  return true;
}

function addRun(w){
  var used = {}, rs = runsOf(w);
  if (rs.length >= 7){ alert("That week already has a run every day."); return; }
  rs.forEach(function(r){ used[r.off] = true; });
  var off = 0;
  for (var i = 0; i < 7; i++) if (!used[i]){ off = i; break; }
  var km = rs.length ? Math.round(rs.reduce(function(a,r){ return a+r.km; }, 0) / rs.length * 10)/10 : 5;
  rs.push({ id:newId(), km:km, off:off });
  sortRuns(w);
  save(); render();
}

function deleteRun(w, d){
  var r = runAt(w, d);
  if (runsOf(w).length <= 1){ alert("A week needs at least one run. Delete the week instead."); return; }
  if (state.logs[r.id] && !confirm("That run is logged. Delete it and its log?")) return;
  delete state.logs[r.id];
  runsOf(w).splice(d, 1);
  save(); render();
}

/* ============================ VIEWS ============================ */
var tab = "today";

function bannersHTML(){
  var h = "";

  painFlags().forEach(function(f){
    h += '<div class="banner danger"><div class="ico">&#9888;</div><div>' +
         '<b>' + esc(f.area) + ' pain logged ' + f.count + ' times in ' + PAIN_WINDOW_DAYS + ' days</b>' +
         'That is a pattern, not a one-off. Consider cutting volume back to the last recovery week ' +
         'until it settles.</div></div>';
  });

  var mw = missedWeek();
  if (mw !== null){
    h += '<div class="banner info"><div class="ico">&#8635;</div><div>' +
         '<b>Week ' + (mw+1) + ' was missed entirely</b>' +
         'Jumping back in at ' + n1(weekTotal(currentWeekIndex())) + ' km risks injury. ' +
         'Shift the rest of the plan forward instead.' +
         '<button class="act" data-act="shift" data-w="' + mw + '">Shift week ' + (mw+1) +
         ' and later to next Monday</button></div></div>';
  }

  overWeeks().forEach(function(o){
    h += '<div class="banner warn"><div class="ico">&#9650;</div><div>' +
         '<b>Week ' + (o.w+1) + ': ' + n1(o.actual) + ' km logged vs ' + o.planned + ' planned</b>' +
         'That is ' + Math.round(o.actual / o.planned * 100) + '% of the plan. ' +
         'Overshooting build weeks is the fastest way to lose the block.</div></div>';
  });

  return h;
}

function runRowHTML(w, d, showToday){
  var l = getLog(w, d), dt = runDate(w, d), t = today();
  var isToday = dayDiff(dt, t) === 0;
  var cls = "run" + (l && l.done ? " done" : "") + (l && l.skipped ? " skipped" : "") +
            (showToday && isToday ? " is-today" : "");
  var right, sub = fmtDate(dt), mets = "";

  if (l && l.done){
    right = '<div class="km">' + n1(l.km) + '<small>' + n1(runAt(w,d).km) + ' plan</small></div>';
    var met = function(v, unit){ return '<em>' + v + (unit ? ' <i>' + unit + '</i>' : '') + '</em>'; };
    var bits = [];
    if (l.durSec) bits.push(met(durStr(l.durSec), ""));
    if (l.km && l.durSec) bits.push(met(paceStr(l.km, l.durSec).replace(" /km", ""), "/km"));
    if (l.hr) bits.push(met(l.hr, "bpm"));
    if (l.kcal) bits.push(met(l.kcal, "kcal"));
    var v = vo2for(l);
    if (v) bits.push(met(v, "VO&#8322;"));
    if (l.splits && l.splits.length) bits.push(met(l.splits.length, "splits"));
    if (bits.length) mets = '<span class="mets">' + bits.join("") + '</span>';
  } else if (l && l.skipped){
    right = '<div class="km" style="color:var(--danger);font-size:14px">Skipped</div>';
  } else {
    right = '<div class="km" style="color:var(--muted)">' + n1(runAt(w,d).km) + '<small>km plan</small></div>';
  }

  var eff = (l && l.done && l.effort) ? '<span class="eff" style="background:var(--' + l.effort + ')"></span>' : "";
  var pain = (l && l.pain && l.pain.area) ? '<div class="pain">&#9888; ' + esc(l.pain.area) + '</div>' : "";

  return '<button class="' + cls + '" data-run="' + w + ',' + d + '">' +
    '<span class="dot"></span>' +
    '<span class="day">' + dayName(w, d) + '</span>' +
    '<span class="mid"><span class="date">' + sub + eff + '</span>' + mets + pain + '</span>' +
    right + '</button>';
}

function viewToday(){

  } else {

    var p = wk(nx.w);
    var when = days === 0 ? "Today" : days === 1 ? "Tomorrow" : fmtLong(dt);
    var badge = days === 0 ? '<span class="badge today">Run day</span>' :

    h += '<div class="card hero' + (p.tag === "RECOVERY" ? " recovery" : "") + '">' +
      '<div class="when">' + esc(when) + ' &middot; Week ' + (nx.w+1) + ' &middot; ' + dayName(nx.w, nx.d) +
      (isLong(nx.w, nx.d) ? " long run" : "") + '</div>' +
      '<div class="dist">' + n1(runAt(nx.w, nx.d).km) + '<span>km</span></div>' +
      '<div class="countdown">' +
        (days === 0 ? '<b>Due today</b>' :
         days === 1 ? 'In <b>1 day</b>' : 'In <b>' + days + ' days</b>') +
        ' &middot; ' + fmtDate(dt) + ' &nbsp;' + badge +
      '</div></div>';

    h += '<button class="btn primary" data-run="' + nx.w + ',' + nx.d + '">Log this run</button>';
    h += '<button class="btn ghost" data-act="import-runs" style="margin-top:10px">Import from a file</button>';
  }

  var c = currentWeekIndex(), act = weekActual(c), pl = weekTotal(c);
  var pct = pl > 0 ? Math.round(act / pl * 100) : 0;
  h += '<div style="height:12px"></div>';
  h += '<div class="card' + (wk(c).tag === "RECOVERY" ? " recovery" : "") + '">' +
    '<div class="wk-head"><div><div class="t">Week ' + (c+1) +
      (wk(c).tag ? ' <span class="badge ' + (wk(c).tag === "PEAK" ? "peak" : "rec") + '">' + wk(c).tag + '</span>' : '') +
      '</div><div class="d">' + fmtDate(weekStart(c)) + ' &ndash; ' +
      fmtDate(addDays(weekStart(c), 6)) + '</div></div>' +
    '<div class="wk-nums"><div class="a">' + n1(act) + ' / ' + n1(pl) + '</div><div class="p">km &middot; ' + pct + '%</div></div></div>' +
    '<div class="bar"><i class="' + (pl > 0 && act > pl * OVER_LIMIT ? "over" : "") + '" style="width:' +
      (pl > 0 ? Math.min(100, act / pl * 100) : 0) + '%"></i></div>' +
    '<div class="runs">' + runsOf(c).map(function(r, d){ return runRowHTML(c, d, true); }).join("") + '</div>' +
  '</div>';

  var r4 = rolling4();
  h += '<div class="stats-row">' +
    '<div class="stat"><div class="v">' + n1(r4.actual) + '</div><div class="k">4-wk volume</div></div>' +
    '<div class="stat"><div class="v">' + streak() + '</div><div class="k">Run streak</div></div>' +
    '</div>';

  return h;
}

function viewPlan(){
  var c = currentWeekIndex(), h = "", grand = 0, w;
  for (w = 0; w < planLen(); w++) grand += weekTotal(w);

  for (w = 0; w < planLen(); w++){
    var p = wk(w), act = weekActual(w), tot = weekTotal(w), open = (w === c);
    var start = weekStart(w);
    var pctW = tot > 0 ? Math.round(act / tot * 100) : 0;
    h += '<div class="card wk' + (p.tag === "RECOVERY" ? " recovery" : "") +
         (w === c ? " current" : "") + (open ? " open" : "") + '" data-wk="' + w + '">' +
      '<button class="wk-head" data-toggle="' + w + '">' +
        '<div><div class="t">Week ' + (w+1) +
          (p.tag ? ' <span class="badge ' + (p.tag === "PEAK" ? "peak" : "rec") + '">' + p.tag + '</span>' : '') +
        '</div><div class="d">' + fmtDate(start) + ' &ndash; ' + fmtDate(addDays(start, 6)) + '</div></div>' +
        '<div class="wk-nums"><div class="a">' + (act ? n1(act) + " / " : "") + n1(tot) + '</div>' +
        '<div class="p">km' + (act ? " &middot; " + pctW + "%" : " planned") + '</div></div>' +
      '</button>' +
      '<div class="wk-body"><div class="bar"><i class="' + (tot > 0 && act > tot*OVER_LIMIT ? "over" : "") +
        '" style="width:' + (tot > 0 ? Math.min(100, act/tot*100) : 0) + '%"></i></div>' +
        '<div class="runs">' + runsOf(w).map(function(r, d){ return runRowHTML(w, d, true); }).join("") + '</div>' +
        '<button class="btn ghost sm" data-act="edit-week" data-w="' + w + '">Edit this week</button>' +
      '</div></div>';
  }

  h += '<div class="card"><div class="wk-head" style="padding:0">' +
      '<div><div class="t">Whole plan</div>' +
      '<div class="d">' + planLen() + ' weeks &middot; ' +
        fmtDate(weekStart(0)) + ' &ndash; ' + fmtDate(lastRunDate(planLen()-1)) + '</div></div>' +
      '<div class="wk-nums"><div class="a">' + n1(grand) + '</div><div class="p">km total</div></div>' +
    '</div>' +
    '<button class="btn" data-act="add-week" style="margin-top:12px">Add a week at the end</button>' +
    '<div class="tiny">Weeks copy the shape of the last one, so add and then edit. ' +
      'Editing the plan never disturbs runs you have already logged.</div></div>';
  return h;
}

/* Tapping a column fills this in. A chart on a phone has no hover, so the
   numbers behind a bar need somewhere to land. */
function barReadoutHTML(i){
  if (i == null || i < 0 || i >= planLen()) return "";
  var tot = weekTotal(i), act = weekActual(i);
  var r = summarise(runsOf(i).map(function(x, d){ return getLog(i, d); }));
  var pct = tot > 0 ? Math.round(act / tot * 100) : 0;
  var over = tot > 0 && act > tot * OVER_LIMIT;
  var start = weekStart(i);
  var bits = [];
  bits.push('<em>' + n1(act) + ' <i>of ' + n1(tot) + ' km</i></em>');
  if (act) bits.push('<em class="' + (over ? "over" : "good") + '">' + pct + ' <i>%</i></em>');
  if (r.runs) bits.push('<em>' + r.runs + ' <i>runs</i></em>');
  if (r.sec) bits.push('<em>' + durStr(r.sec) + '</em>');
  if (r.km && r.sec) bits.push('<em>' + paceStr(r.km, r.sec).replace(" /km","") + ' <i>/km</i></em>');
  if (r.hr) bits.push('<em>' + r.hr + ' <i>bpm</i></em>');
  if (r.kcal) bits.push('<em>' + r.kcal + ' <i>kcal</i></em>');
  return '<div class="readout"><div class="rh">Week ' + (i+1) +
    (wk(i).tag ? ' <span class="badge ' + (wk(i).tag === "PEAK" ? "peak" : "rec") + '">' + wk(i).tag + '</span>' : '') +
    '<span class="rd">' + fmtDate(start) + ' &ndash; ' + fmtDate(addDays(start, 6)) + '</span></div>' +
    '<div class="mets">' + bits.join("") + '</div></div>';
}

function viewStats(){
  var maxKm = 0, i;
  for (i = 0; i < planLen(); i++) maxKm = Math.max(maxKm, weekTotal(i), weekActual(i));
  maxKm = Math.ceil((maxKm + 2) / 5) * 5 || 5;

  var W = 340, H = 190, padL = 26, padB = 24, padT = 8;
  var plotW = W - padL - 6, plotH = H - padB - padT;
  var step = plotW / planLen(), bw = Math.min(20, step * 0.62);
  var labelEvery = planLen() <= 16 ? 1 : Math.ceil(planLen() / 12);

  var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
  [0, 0.5, 1].forEach(function(f){
    var y = padT + plotH * (1 - f);
    svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL+plotW) + '" y2="' + y +
           '" stroke="#2b333f" stroke-width="1"/>' +
           '<text x="' + (padL-5) + '" y="' + (y+3.5) + '" fill="#6b7688" font-size="9" text-anchor="end">' +
           Math.round(maxKm*f) + '</text>';
  });
  var cur = currentWeekIndex();
  for (i = 0; i < planLen(); i++){
    var cx = padL + step * i + step/2;
    var tot = weekTotal(i);
    var ph = plotH * (tot / maxKm);
    var a  = weekActual(i), ah = plotH * (a / maxKm);
    var isRec = wk(i).tag === "RECOVERY";
    var base = padT + plotH;

    // Full-height invisible target: a 20px bar is not a tap target, and on a
    // phone the whole column has to be pressable.
    svg += '<rect class="hit" x="' + (padL + step*i) + '" y="' + padT + '" width="' + step +
           '" height="' + plotH + '" fill="transparent" data-bar="' + i + '"/>';

    // A tick under the axis, not a filled column: a pale full-height block
    // behind the bar reads as a bar itself and misstates the week's volume.
    if (i === cur)
      svg += '<rect x="' + (cx - bw/2) + '" y="' + (base + 3) + '" width="' + bw +
             '" height="2.5" rx="1.25" fill="#3ce08c"/>';

    svg += '<rect x="' + (cx - bw/2) + '" y="' + (base - ph) + '" width="' + bw +
           '" height="' + Math.max(ph, 2) + '" rx="4" fill="' + (isRec ? "#2a3f5c" : "#333e4e") + '"/>';
    if (a > 0){
      var over = tot > 0 && a > tot * OVER_LIMIT;
      // 2px of surface either side, so planned and actual read as two marks
      svg += '<rect x="' + (cx - bw/2 + 3) + '" y="' + (base - ah) + '" width="' + (bw-6) +
             '" height="' + Math.max(ah, 2) + '" rx="3" fill="' + (over ? "#ffb03a" : "#3ce08c") + '"/>';
    }
    if (i % labelEvery === 0 || i === planLen()-1 || i === cur)
      svg += '<text x="' + cx + '" y="' + (H-8) + '" fill="' +
             (i === cur ? "#f3f6fa" : isRec ? "#5ea8ff" : "#6b7688") +
             '" font-size="9" font-weight="' + (i === cur ? "700" : "400") +
             '" text-anchor="middle">' + (i+1) + '</text>';
  }
  svg += '</svg>';

  var r4 = rolling4();
  var totalA = 0, totalP = 0, doneN = 0, skipN = 0;
  for (i = 0; i < planLen(); i++){ totalA += weekActual(i); totalP += weekTotal(i); }
  Object.keys(state.logs).forEach(function(k){
    var l = state.logs[k]; if (l && l.done) doneN++; else if (l && l.skipped) skipN++;
  });

  var h = '<div class="card"><div class="label">Planned vs actual &middot; km per week</div>' + svg +
    '<div id="barReadout">' + barReadoutHTML(cur) + '</div>' +
    '<div class="legend">' +
      '<span><i style="background:#333e4e"></i>Planned</span>' +
      '<span><i style="background:#3ce08c"></i>Actual</span>' +
      '<span><i style="background:#ffb03a"></i>Over 110%</span>' +
      '<span><i style="background:#2a3f5c"></i>Recovery week</span>' +
    '</div></div>';

  h += '<div class="stats-row" style="margin-bottom:12px">' +
    '<div class="stat"><div class="v">' + n1(totalA) + '</div><div class="k">km logged</div></div>' +
    '<div class="stat"><div class="v">' + totalP + '</div><div class="k">km planned</div></div>' +
    '</div>';
  h += '<div class="stats-row" style="margin-bottom:12px">' +
    '<div class="stat"><div class="v">' + n1(r4.actual) + '</div><div class="k">Rolling 4 wk</div></div>' +
    '<div class="stat"><div class="v">' + streak() + '</div><div class="k">Streak</div></div>' +
    '</div>';
  var allKcal = 0, allSec = 0;
  allLogs().forEach(function(l){ allKcal += (l.kcal || 0); allSec += (l.durSec || 0); });
  h += '<div class="stats-row">' +
    '<div class="stat"><div class="v">' + doneN + '</div><div class="k">Runs done</div></div>' +
    '<div class="stat"><div class="v">' + skipN + '</div><div class="k">Skipped</div></div>' +
    '</div>';
  if (allKcal || allSec){
    h += '<div class="stats-row" style="margin-top:12px">' +
      '<div class="stat"><div class="v">' + (allKcal ? fmtK(allKcal) : "&mdash;") +
        '</div><div class="k">kcal burned</div></div>' +
      '<div class="stat"><div class="v">' + (allSec ? n1(allSec / 3600) : "&mdash;") +
        '</div><div class="k">hours running</div></div>' +
      '</div>';
  }

  /* ---- week by week ---- */
  var wr = weekRows(), anyWeek = wr.some(function(r){ return r.runs || r.skipped; });
  h += '<div class="card" style="margin-top:12px"><div class="label">Week by week</div><div class="tbl"><table>' +
    '<thead><tr><th>Wk</th><th>From</th><th class="n">Plan</th><th class="n">Done</th>' +
    '<th class="n">%</th><th class="n">Runs</th><th class="n">Pace</th><th class="n">HR</th>' +
    '<th class="n">kcal</th></tr></thead><tbody>';
  wr.forEach(function(r){
    var pct = r.planned > 0 ? Math.round(r.km / r.planned * 100) : 0;
    var cls = r.planned > 0 && r.km > r.planned * OVER_LIMIT ? "over"
            : (pct >= 100 ? "good" : "");
    h += '<tr' + (r.w === currentWeekIndex() ? ' class="cur"' : '') + '>' +
      '<td>' + (r.w+1) + (r.tag ? ' <span class="dotm ' + (r.tag === "PEAK" ? "pk" : "rc") + '"></span>' : '') + '</td>' +
      '<td class="dim">' + fmtDate(r.start) + '</td>' +
      '<td class="n">' + n1(r.planned) + '</td>' +
      '<td class="n">' + (r.km ? n1(r.km) : "&mdash;") + '</td>' +
      '<td class="n ' + cls + '">' + (r.km ? pct + "%" : "&mdash;") + '</td>' +
      '<td class="n">' + (r.runs || "&mdash;") + (r.skipped ? '<span class="sk"> ' + r.skipped + 's</span>' : '') + '</td>' +
      '<td class="n">' + (r.km && r.sec ? paceStr(r.km, r.sec).replace(" /km", "") : "&mdash;") + '</td>' +
      '<td class="n">' + (r.hr || "&mdash;") + '</td>' +
      '<td class="n">' + (r.kcal ? r.kcal : "&mdash;") + '</td></tr>';
  });
  h += '</tbody></table></div>' +
    (anyWeek ? '' : '<div class="tiny">Nothing logged yet, so only the plan column is filled.</div>') +
    '</div>';

  /* ---- month by month ---- */
  var mr = monthRows();
  h += '<div class="card" style="margin-top:12px"><div class="label">Month by month</div><div class="tbl"><table>' +
    '<thead><tr><th>Month</th><th class="n">Plan</th><th class="n">Done</th><th class="n">Runs</th>' +
    '<th class="n">Time</th><th class="n">Pace</th><th class="n">HR</th>' +
    '<th class="n">kcal</th></tr></thead><tbody>';
  if (!mr.length){
    h += '<tr><td colspan="8" class="dim">Nothing yet.</td></tr>';
  } else {
    mr.forEach(function(r){
      h += '<tr><td>' + esc(r.label) + '</td>' +
        '<td class="n">' + (r.planned ? n1(r.planned) : "&mdash;") + '</td>' +
        '<td class="n">' + (r.km ? n1(r.km) : "&mdash;") + '</td>' +
        '<td class="n">' + (r.runs || "&mdash;") + '</td>' +
        '<td class="n">' + (r.sec ? durStr(r.sec) : "&mdash;") + '</td>' +
        '<td class="n">' + (r.km && r.sec ? paceStr(r.km, r.sec).replace(" /km", "") : "&mdash;") + '</td>' +
        '<td class="n">' + (r.hr || "&mdash;") + '</td>' +
        '<td class="n">' + (r.kcal ? r.kcal : "&mdash;") + '</td></tr>';
    });
  }
  h += '</tbody></table></div>' +
    '<div class="tiny">Months are calendar months, taken from the date each run happened, so ' +
    'a week straddling the turn of a month is split between the two.</div></div>';

  /* ---- runs outside the plan ---- */
  if (state.extras.length){
    var ex = extraLogs();
    var exKm = ex.reduce(function(a, l){ return a + (l.km || 0); }, 0);
    var exSec = ex.reduce(function(a, l){ return a + (l.durSec || 0); }, 0);
    h += '<div class="card" style="margin-top:12px"><div class="label">History &middot; outside the plan</div>' +
      '<div class="stats-row" style="margin:10px 0 12px">' +
        '<div class="stat"><div class="v">' + ex.length + '</div><div class="k">Runs</div></div>' +
        '<div class="stat"><div class="v">' + n1(exKm) + '</div><div class="k">km</div></div>' +
      '</div>' +
      '<div class="tbl"><table><thead><tr><th>Date</th><th class="n">km</th><th class="n">Time</th>' +
      '<th class="n">Pace</th><th class="n">HR</th><th class="n">kcal</th><th></th></tr></thead><tbody>';
    state.extras.slice().reverse().forEach(function(l){
      var i = state.extras.indexOf(l);
      h += '<tr><td class="dim">' + esc(l.date || "&mdash;") + '</td>' +
        '<td class="n">' + n1(l.km || 0) + '</td>' +
        '<td class="n">' + (l.durSec ? durStr(l.durSec) : "&mdash;") + '</td>' +
        '<td class="n">' + (l.km && l.durSec ? paceStr(l.km, l.durSec).replace(" /km", "") : "&mdash;") + '</td>' +
        '<td class="n">' + (l.hr || "&mdash;") + '</td>' +
        '<td class="n">' + (l.kcal || "&mdash;") + '</td>' +
        '<td class="n"><button class="xs" data-act="del-extra" data-i="' + i + '">&times;</button></td></tr>';
    });
    h += '</tbody></table></div>' +
      '<div class="tiny">Runs with no place in the plan &mdash; imported history, or anything run ' +
      'alongside the block. They count in the monthly table, the totals above, the VO<sub>2</sub> ' +
      'trend and average heart rate, but never towards a plan week, so they cannot trip the ' +
      'over-volume or recovery warnings. Total time ' + (exSec ? durStr(exSec) : "&mdash;") + '.' +
      '<br><button class="btn ghost danger sm" data-act="clear-extras" style="margin-top:10px">' +
      'Remove all history</button></div></div>';
  }

  /* ---- VO2 max trend ---- */
  var vs = vo2Series(), hrAvg = avgHR();
  h += '<div class="card" style="margin-top:12px"><div class="label">Estimated VO<sub>2</sub> max</div>';
  if (vs.length < 1){
    h += '<div class="empty" style="padding:22px 8px">Log a run with an average heart rate and an ' +
         'estimate appears here.</div>';
  } else {
    var vv = vs.map(function(p){ return p.vo2; });
    var lo = Math.floor(Math.min.apply(null, vv) - 2), hi = Math.ceil(Math.max.apply(null, vv) + 2);
    if (hi - lo < 6){ lo -= 3; hi += 3; }
    var CW = 340, CH = 140, cl = 30, cb = 18, cw = CW - cl - 8, ch = CH - cb - 8;
    var xf = function(i){ return vs.length < 2 ? cl + cw/2 : cl + cw * (i / (vs.length - 1)); };
    var yf = function(v){ return 8 + ch * (1 - (v - lo) / (hi - lo)); };
    var svg = '<svg class="chart" style="height:150px" viewBox="0 0 ' + CW + ' ' + CH + '" preserveAspectRatio="xMidYMid meet">';
    [lo, (lo+hi)/2, hi].forEach(function(g){
      svg += '<line x1="' + cl + '" y1="' + yf(g) + '" x2="' + (cl+cw) + '" y2="' + yf(g) +
             '" stroke="#2b333f" stroke-width="1"/>' +
             '<text x="' + (cl-5) + '" y="' + (yf(g)+3.5) + '" fill="#6b7688" font-size="9" text-anchor="end">' +
             (Math.round(g*10)/10) + '</text>';
    });
    if (vs.length > 1){
      var pts = vs.map(function(p, i){ return xf(i) + "," + yf(p.vo2); }).join(" ");
      // One series, so the fill carries no extra meaning — it just anchors the
      // line to the baseline and stops it floating in the panel.
      svg += '<defs><linearGradient id="vg" x1="0" y1="0" x2="0" y2="1">' +
             '<stop offset="0%" stop-color="#3ce08c" stop-opacity=".26"/>' +
             '<stop offset="100%" stop-color="#3ce08c" stop-opacity="0"/></linearGradient></defs>';
      svg += '<polygon fill="url(#vg)" points="' + xf(0) + ',' + (8 + ch) + ' ' + pts + ' ' +
             xf(vs.length-1) + ',' + (8 + ch) + '"/>';
      svg += '<polyline fill="none" stroke="#3ce08c" stroke-width="2" stroke-linejoin="round" ' +
             'stroke-linecap="round" points="' + pts + '"/>';
    }
    // Only the endpoints are marked and labelled — a dot on all 40 runs is noise.
    vs.forEach(function(p, i){
      var last = i === vs.length - 1;
      if (!last && i !== 0 && vs.length > 2) return;
      svg += '<circle cx="' + xf(i) + '" cy="' + yf(p.vo2) + '" r="' + (last ? 4.5 : 3) +
             '" fill="#3ce08c" stroke="#151920" stroke-width="2"/>';
    });
    var lastP = vs[vs.length-1];
    svg += '<text x="' + Math.min(xf(vs.length-1), CW - 16) + '" y="' + (yf(lastP.vo2) - 9) +
           '" fill="#f3f6fa" font-size="11" font-weight="700" text-anchor="end">' + lastP.vo2 + '</text>';
    svg += '</svg>';
    var latest = vs[vs.length-1].vo2, first = vs[0].vo2, delta = Math.round((latest - first) * 10) / 10;
    h += svg + '<div class="legend"><span>Latest <b style="color:var(--text)">' + latest + '</b></span>' +
      (vs.length > 1 ? '<span>Change <b style="color:' + (delta >= 0 ? "var(--accent)" : "var(--warn)") +
        '">' + (delta > 0 ? "+" : "") + delta + '</b></span>' : '') +
      '<span>From ' + vs.length + ' run' + (vs.length === 1 ? '' : 's') + '</span></div>' +
      '<div class="tiny">Estimated from your pace and heart rate on each run, not read from the watch &mdash; ' +
      'Samsung does not expose its own figure to other apps. Accuracy depends on the HR limits below.</div>';
  }
  h += '</div>';

  if (hrAvg){
    h += '<div class="stats-row" style="margin-bottom:12px">' +
      '<div class="stat"><div class="v">' + hrAvg + '</div><div class="k">Avg HR (bpm)</div></div>' +
      '<div class="stat"><div class="v">' + (vs.length ? vs[vs.length-1].vo2 : "&mdash;") + '</div><div class="k">Latest VO&#8322;</div></div>' +
      '</div>';
  }

  /* ---- heart rate limits, needed by the VO2 estimate ---- */
  h += '<div class="card"><div class="label" style="margin-bottom:12px">Heart rate limits</div>' +
    '<div class="inputs">' +
      '<div class="inp"><input id="s-hrmax" type="number" inputmode="numeric" min="120" max="230" value="' + state.settings.hrMax + '"><span class="u">max</span></div>' +
      '<div class="inp"><input id="s-hrrest" type="number" inputmode="numeric" min="30" max="110" value="' + state.settings.hrRest + '"><span class="u">resting</span></div>' +
    '</div>' +
    '<button class="btn" data-act="save-hr" style="margin-top:12px">Save limits</button>' +
    '<div class="tiny">Every VO<sub>2</sub> estimate is scaled by these. If you do not know your max, ' +
    '220 minus your age is the usual starting point; the highest figure you have actually seen on a hard ' +
    'effort is better.</div></div>';

  h += '<div class="card"><div class="label" style="margin-bottom:12px">Your data</div>' +
    '<button class="btn primary" data-act="import-runs" style="margin-bottom:10px">Import runs from a file</button>' +
    '<div class="btn-row" style="margin-bottom:10px">' +
      '<button class="btn" data-act="export">Export JSON</button>' +
      '<button class="btn" data-act="copy">Copy</button>' +
    '</div>' +
    '<button class="btn ghost" data-act="import" style="margin-bottom:10px">Restore a backup</button>' +
    '<button class="btn ghost danger" data-act="reset">Erase logs and reset the plan</button>' +
    '<div class="tiny">Everything lives in this browser only &mdash; no account, no server, no network calls. ' +
    'Clearing Safari website data will wipe it, so export now and again.</div></div>';

  return h;
}

var lastTab = null;
function render(){
  var t = today();
  document.getElementById("title").textContent =
    tab === "today" ? "Today" : tab === "plan" ? planLen() + "-week plan" : "Stats";
  document.getElementById("subtitle").textContent =
    tab === "today" ? fmtLong(t) : "Week " + (currentWeekIndex()+1) + " of " + planLen();

  var view = document.getElementById("view");
  view.innerHTML =
    tab === "today" ? viewToday() : tab === "plan" ? viewPlan() : viewStats();

  // Entrance is for arriving at a tab. Replaying it every time a run is saved
  // turns a nicety into a stutter.
  view.classList.toggle("anim", tab !== lastTab);
  lastTab = tab;

  Array.prototype.forEach.call(document.querySelectorAll(".tabbar button"), function(b){
    b.classList.toggle("on", b.dataset.tab === tab);
  });
  if (tab === "plan"){
    var cur = document.querySelector(".wk.current");
    if (cur) cur.scrollIntoView({ block:"center" });
  } else {
    window.scrollTo(0, 0);
  }
}

/* ============================ LOG SHEET ============================ */
var scrim = document.getElementById("scrim"), sheet = document.getElementById("sheet");
var draft = null;

function openSheet(w, d){
  var l = getLog(w, d) || {};
  draft = {
    w:w, d:d,
    status: l.done ? "done" : l.skipped ? "skipped" : "done",
    km: (typeof l.km === "number") ? l.km : runAt(w, d).km,
    min: l.durSec ? Math.floor(l.durSec/60) : "",
    sec: l.durSec ? l.durSec%60 : "",
    hr: l.hr || "",
    kcal: l.kcal || "",
    splits: splitsToText(l.splits),
    effort: l.effort || "moderate",
    painOn: !!(l.pain && l.pain.area),
    area: l.pain ? l.pain.area : null,
    note: l.pain ? (l.pain.note || "") : "",
    existing: !!(l.done || l.skipped)
  };
  drawSheet();
  scrim.classList.add("on"); sheet.classList.add("on");
}
function closeSheet(){
  scrim.classList.remove("on"); sheet.classList.remove("on");
  draft = null; editW = null;
}
/* Position of a run inside its week, by id — indices move when days change. */
function indexOfRun(w, id){
  var rs = runsOf(w);
  for (var i = 0; i < rs.length; i++) if (rs[i].id === id) return i;
  return -1;
}

function drawSheet(){
  var w = draft.w, d = draft.d, p = wk(w), r = runAt(w, d), dt = runDate(w, d);
  var seg = function(name, val, label){
    return '<button data-field="' + name + '" data-v="' + val + '"' +
           (draft[name] === val ? ' class="on"' : '') + '>' + label + '</button>';
  };

  var h = '<div class="grab"></div>' +
    '<h2>Week ' + (w+1) + ' &middot; ' + dayName(w, d) + (isLong(w, d) ? " long run" : "") + '</h2>' +
    '<div class="sub">' + fmtLong(dt) + ' &middot; ' + n1(r.km) + ' km planned' +
    (p.tag === "RECOVERY" ? ' &middot; <span style="color:var(--recovery);font-weight:700">recovery week</span>' : '') +
    '</div>';

  /* Reschedule in place — the common case is "cannot make it today". */
  if (!draft.existing){
    h += '<div class="field"><span class="label">Scheduled day</span><div class="days">' +
      WD_SHORT.map(function(nm, off){
        var taken = runsOf(w).some(function(o){ return o !== r && o.off === off; });
        return '<button data-act="move-run" data-w="' + w + '" data-d="' + d + '" data-off="' + off + '"' +
               (r.off === off ? ' class="on"' : (taken ? ' class="busy" disabled' : '')) + '>' + nm + '</button>';
      }).join("") + '</div>' +
      '<div class="tiny" style="margin-top:6px">Moves this run inside its own week, so the week&rsquo;s ' +
      'total and the guards still hold. To move further, shift the week from the plan.</div></div>';
  }

  h += '<div class="field"><span class="label">Status</span><div class="seg">' +
    seg("status","done","Completed") + seg("status","skipped","Skipped") + '</div></div>';

  if (draft.status === "done"){
    h += '<div class="field"><span class="label">Distance &amp; time</span><div class="inputs">' +
      '<div class="inp"><input id="f-km" type="number" inputmode="decimal" step="0.1" min="0" value="' + draft.km + '"><span class="u">km</span></div>' +
      '<div class="inp"><input id="f-min" type="number" inputmode="numeric" min="0" placeholder="0" value="' + draft.min + '"><span class="u">min</span></div>' +
      '<div class="inp"><input id="f-sec" type="number" inputmode="numeric" min="0" max="59" placeholder="00" value="' + draft.sec + '"><span class="u">sec</span></div>' +

    h += '<div class="field"><span class="label">Heart rate &amp; energy</span><div class="inputs">' +

function readInputs(){
  var km = document.getElementById("f-km"), mi = document.getElementById("f-min"), se = document.getElementById("f-sec"),
      hr = document.getElementById("f-hr"), sp = document.getElementById("f-splits"),
      kc = document.getElementById("f-kcal"), nt = document.getElementById("f-note");
  if (km) draft.km  = km.value === "" ? 0 : parseFloat(km.value);
  if (mi) draft.min = mi.value === "" ? "" : parseInt(mi.value, 10);
  if (se) draft.sec = se.value === "" ? "" : parseInt(se.value, 10);
  if (hr) draft.hr  = hr.value === "" ? "" : parseInt(hr.value, 10);
  if (kc) draft.kcal = kc.value === "" ? "" : parseInt(kc.value, 10);
  if (sp) draft.splits = sp.value;
  if (nt) draft.note = nt.value;
}
function draftSec(){
  return (parseInt(draft.min, 10) || 0) * 60 + (parseInt(draft.sec, 10) || 0);
}
function syncPace(){
  var el = document.getElementById("pace");
  if (!el) return;
  var sec = draftSec();
  el.innerHTML = (draft.km > 0 && sec > 0) ? "Average pace <b>" + paceStr(draft.km, sec) + "</b>" : "";

  var vel = document.getElementById("vo2");
  if (vel){
    var v = vo2for({ done:true, km:draft.km, durSec:sec, hr:parseInt(draft.hr, 10) });
    vel.innerHTML = v ? "Estimated VO<sub>2</sub> max <b>" + v + "</b>"
      : (draft.hr ? '<span style="color:var(--dim)">Need distance and time too</span>'
                  : '<span style="color:var(--dim)">Add heart rate for a VO<sub>2</sub> estimate</span>');
  }

  var sel = document.getElementById("splitsum");
  if (sel){
    var sp = parseSplits(draft.splits);
    if (!sp){ sel.innerHTML = ""; return; }
    var fast = Math.min.apply(null, sp), slow = Math.max.apply(null, sp);
    var tot = sp.reduce(function(a, b){ return a+b; }, 0);
    sel.innerHTML = sp.length + " split" + (sp.length === 1 ? "" : "s") +
      " &middot; fastest <b>" + splitStr(fast) + "</b> &middot; slowest <b>" + splitStr(slow) +
      "</b> &middot; mean <b>" + splitStr(tot / sp.length) + "</b>";
  }
}

function saveDraft(){
  readInputs();
  var w = draft.w, d = draft.d, p = wk(w), pkm = runAt(w, d).km;

  if (draft.status === "skipped"){
    setLog(w, d, {
      done:false, skipped:true, date:toISO(runDate(w, d)), ts:Date.now(),
      pain: draft.painOn && draft.area ? { area:draft.area, note:draft.note } : null
    });
    save(); closeSheet(); render(); return;
  }

  var km = parseFloat(draft.km);
  if (!(km > 0)) { alert("Enter a distance greater than zero, or mark the run skipped."); return; }
  if (draft.painOn && !draft.area) { alert("Pick where the pain was."); return; }

  var sec = (parseInt(draft.min, 10) || 0) * 60 + (parseInt(draft.sec, 10) || 0);

  /* Recovery-week guard: warn before saving a run longer than planned. */
  if (p.tag === "RECOVERY"){
    var prev = getLog(w, d);
    var others = weekActual(w) - (prev && prev.done ? prev.km : 0);
    var wtot = weekTotal(w);
    var msgs = [];
    if (km > pkm) msgs.push("This run is " + n1(km) + " km against " + n1(pkm) + " km planned.");
    if (others + km > wtot) msgs.push("The week would reach " + n1(others + km) + " km against " + n1(wtot) + " km planned.");
    if (msgs.length && !confirm(
        "Week " + (w+1) + " is a recovery week.\n\n" + msgs.join("\n") +
        "\n\nRecovery weeks are what let the build weeks work. Save anyway?")) return;
  }

  var hr = parseInt(draft.hr, 10), kc = parseInt(draft.kcal, 10);
  setLog(w, d, {
    done:true, skipped:false,
    km:km, durSec:sec, effort:draft.effort,
    hr: (hr > 0 ? hr : null),
    kcal: (kc > 0 ? kc : null),
    splits: parseSplits(draft.splits),
    date:toISO(runDate(w, d)), ts:Date.now(),
    pain: draft.painOn && draft.area ? { area:draft.area, note:draft.note } : null
  });
  save(); closeSheet(); render();
}
