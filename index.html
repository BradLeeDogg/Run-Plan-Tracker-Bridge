<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Run Plan</title>
<meta name="theme-color" content="#0a0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Run Plan">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<style>
:root{
  --bg:#0a0c10; --surface:#151920; --surface2:#1d232d; --line:#2b333f;
  --text:#f3f6fa; --muted:#95a1b4; --dim:#6b7688;
  --accent:#3ce08c; --accent-dim:#1d6b45;
  --planned:#333e4e;
  --warn:#ffb03a; --danger:#ff5f5f; --recovery:#5ea8ff;
  --easy:#3ce08c; --moderate:#ffb03a; --hard:#ff5f5f;
  --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}

#view{
  padding:14px 14px calc(96px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
}
/* Cards arriving all at once reads as a flash; a short stagger reads as a page. */
@media (prefers-reduced-motion:no-preference){
  #view.anim>*{animation:rise .26s cubic-bezier(.22,.9,.3,1) both}
  #view.anim>*:nth-child(2){animation-delay:.03s}
  #view.anim>*:nth-child(3){animation-delay:.06s}
  #view.anim>*:nth-child(n+4){animation-delay:.09s}
}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.topbar{
  padding:calc(10px + env(safe-area-inset-top)) 14px 6px;
  max-width:640px;margin:0 auto;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
.topbar h1{font-size:19px}
.topbar .sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,0)) var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
.card.recovery{border-color:var(--recovery);background:linear-gradient(180deg,rgba(94,168,255,.10),rgba(94,168,255,.02))}
.label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- today hero ---------- */
.hero .when{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.hero{position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;top:-70px;right:-70px;width:200px;height:200px;
  background:radial-gradient(circle,rgba(60,224,140,.13),transparent 68%);pointer-events:none;
}
.hero .dist{font-size:66px;line-height:1;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.hero .dist span{font-size:24px;font-weight:700;color:var(--muted);margin-left:4px;letter-spacing:0}
.hero .countdown{margin-top:10px;font-size:15px;color:var(--muted)}
.hero .countdown b{color:var(--text)}
.badge{
  display:inline-block;padding:4px 10px;border-radius:999px;
  font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
}
.badge.rec{background:rgba(94,168,255,.16);color:var(--recovery);border:1px solid rgba(94,168,255,.4)}
.badge.today{background:rgba(60,224,140,.16);color:var(--accent);border:1px solid rgba(60,224,140,.4)}
.badge.peak{background:rgba(255,95,95,.14);color:var(--danger);border:1px solid rgba(255,95,95,.4)}
/* How much the projection rests on. Green only once the evidence earns it. */
.badge.conf.good{background:rgba(60,224,140,.16);color:var(--accent);border:1px solid rgba(60,224,140,.4)}
.badge.conf.fair{background:rgba(94,168,255,.16);color:var(--recovery);border:1px solid rgba(94,168,255,.4)}
.badge.conf.early{background:rgba(255,176,58,.14);color:var(--warn);border:1px solid rgba(255,176,58,.38)}
.badge.conf.raw{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.hero.pred .dist{font-size:52px}
.hero.pred::after{display:none}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:var(--tap);border-radius:14px;
  font-weight:700;font-size:17px;background:var(--surface2);
  border:1px solid var(--line);padding:0 16px;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);color:#06210f;border-color:var(--accent);min-height:62px;font-size:19px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(255,95,95,.4)}
.btn[disabled]{opacity:.4}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1}

/* ---------- weekly strip ---------- */
.stats-row{display:flex;gap:10px}
.stat{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,0)) var(--surface);
}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-top:3px}
.bar{height:10px;border-radius:6px;background:var(--planned);overflow:hidden;margin-top:10px}
.bar>i{
  display:block;height:100%;border-radius:6px;transition:width .45s cubic-bezier(.22,.9,.3,1);
  background:linear-gradient(90deg,var(--accent-dim),var(--accent));
}
.bar>i.over{background:linear-gradient(90deg,#a86a12,var(--warn))}

/* ---------- banners ---------- */
.banner{
  border-radius:14px;padding:13px 14px;margin-bottom:12px;
  font-size:14px;line-height:1.4;border:1px solid;
  display:flex;gap:11px;align-items:flex-start;
}
.banner .ico{font-size:17px;line-height:1.2}
.banner b{display:block;margin-bottom:2px;font-size:14px}
.banner.warn{background:rgba(255,176,58,.11);border-color:rgba(255,176,58,.42);color:#ffd699}
.banner.danger{background:rgba(255,95,95,.11);border-color:rgba(255,95,95,.42);color:#ffbdbd}
.banner.info{background:rgba(94,168,255,.11);border-color:rgba(94,168,255,.42);color:#c2ddff}
.banner .act{
  margin-top:10px;display:block;width:100%;min-height:46px;border-radius:11px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);
  font-weight:700;font-size:15px;color:inherit;
}

/* ---------- run rows ---------- */
.runs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.run{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:60px;padding:11px 12px;border-radius:14px;
  background:var(--surface2);border:1px solid transparent;
  transition:transform .12s ease, border-color .2s ease;
}
.run:active{transform:scale(.99)}
.run.done{border-color:rgba(60,224,140,.18)}
.run.is-today{border-color:var(--accent);box-shadow:0 0 0 3px rgba(60,224,140,.10)}
.run .dot{width:11px;height:11px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.run.done .dot{background:var(--accent)}
.run.skipped .dot{background:var(--danger)}
.run .day{width:34px;font-weight:800;font-size:14px;flex:0 0 auto}
.run .date{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.run .mid{flex:1;min-width:0}
.run .km{font-weight:800;font-variant-numeric:tabular-nums;font-size:17px;text-align:right}
.run .km small{display:block;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.02em}
.run .pain{color:var(--danger);font-size:11px;font-weight:700;margin-top:3px}
.run .eff{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle}

/* A run carries five or six numbers. As a run-on sentence of middots they are
   unreadable; as value+unit pairs the eye can jump straight to the one it
   wants, and the strip wraps instead of overflowing. */
.mets{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px}
.mets em{
  font-style:normal;font-weight:700;font-size:13px;
  font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap;
}
.mets em i{font-style:normal;font-weight:600;font-size:11px;color:var(--dim)}

/* ---------- week list ---------- */
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.wk-head .t{font-size:17px;font-weight:800}
.wk-head .d{font-size:12px;color:var(--muted);font-weight:600}
.wk-nums{text-align:right;font-variant-numeric:tabular-nums}
.wk-nums .a{font-size:17px;font-weight:800}
.wk-nums .p{font-size:12px;color:var(--muted)}
.wk-body{display:none}
.wk.open .wk-body{display:block}
.wk.current{border-color:var(--accent)}

/* ---------- chart ---------- */
.chart{width:100%;height:210px;display:block;touch-action:manipulation}
/* The bars are painted over the tap targets, so without this they swallow the
   tap and the most natural place to press — the bar itself — does nothing. */
.chart>*{pointer-events:none}
.chart .hit{pointer-events:auto;cursor:pointer}
.legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.readout{
  margin-top:12px;padding:11px 12px;border-radius:12px;
  background:var(--surface2);border:1px solid var(--line);
}
.readout .rh{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-size:14px;font-weight:800;margin-bottom:7px;
}
.readout .rd{font-size:12px;font-weight:600;color:var(--muted)}
.readout .mets{margin-top:0}
.readout .mets em.good{color:var(--accent)}
.readout .mets em.over{color:var(--warn)}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;background:rgba(10,12,16,.93);
  backdrop-filter:saturate(150%) blur(14px);
  -webkit-backdrop-filter:saturate(150%) blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--surface);border-radius:22px 22px 0 0;
  border-top:1px solid var(--line);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px 14px calc(20px + env(safe-area-inset-bottom));
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 14px}
.sheet h2{font-size:21px;margin-bottom:3px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.field{margin-bottom:16px}
.field>.label{display:block;margin-bottom:8px}
.seg{display:flex;gap:8px}
.seg button{
  flex:1;min-height:var(--tap);border-radius:13px;border:1.5px solid var(--line);
  background:var(--surface2);font-weight:700;font-size:16px;
}
.seg button.on{background:var(--accent);color:#06210f;border-color:var(--accent)}
.seg button.on[data-v=skipped]{background:var(--danger);color:#2a0000;border-color:var(--danger)}
.seg button.on[data-v=easy]{background:var(--easy);color:#06210f;border-color:var(--easy)}
.seg button.on[data-v=moderate]{background:var(--moderate);color:#241500;border-color:var(--moderate)}
.seg button.on[data-v=hard]{background:var(--hard);color:#2a0000;border-color:var(--hard)}

/* ---- day picker: seven tap targets, so it has to stay compact ---- */
.days{display:flex;gap:5px}
.days button{
  flex:1;min-height:44px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--surface2);font-weight:700;font-size:13px;padding:0;
}
.days button.on{background:var(--accent);color:#06210f;border-color:var(--accent)}
.days button.busy{opacity:.32}

/* ---- one editable run: day, distance, remove ---- */
.rowedit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.rowedit select{
  min-height:var(--tap);border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface2);color:var(--text);font-weight:700;font-size:15px;
  padding:0 8px;flex:0 0 88px;
}
.rowedit .inp{flex:1}
/* the column header already says km — repeating it per row doubles the height */
.rowedit .inp .u{display:none}
.rowedit .x{
  flex:0 0 var(--tap);min-height:var(--tap);border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface2);
  color:var(--danger);font-size:22px;line-height:1;
}
.rowedit .lg{color:var(--accent);font-size:12px;margin-left:-4px}
.btn.sm{min-height:42px;font-size:14px}
.xs{
  min-width:30px;min-height:30px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface2);color:var(--danger);font-size:16px;line-height:1;padding:0;
}

/* ---- breakdown tables ---- */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
.tbl th,.tbl td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.dim{color:var(--muted)}
.tbl tr.cur td{background:rgba(60,224,140,.07)}
.tbl td.good{color:var(--accent);font-weight:700}
.tbl td.over{color:var(--warn);font-weight:700}
.tbl .sk{color:var(--danger);font-size:11px}
.tbl tbody tr:last-child td{border-bottom:none}
/* ---------- time browser ---------- */
.crumbs{
  display:flex;align-items:center;flex-wrap:wrap;gap:2px;
  margin:10px 0 12px;font-size:13px;
}
.crumbs .crumb{
  padding:5px 9px;border-radius:9px;font-weight:700;color:var(--accent);
  background:rgba(60,224,140,.09);border:1px solid rgba(60,224,140,.22);
}
.crumbs .crumb.on{color:var(--text);background:var(--surface2);border-color:var(--line)}
.crumbs .sep{color:var(--dim);padding:0 2px}
.drills{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.drill{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:58px;padding:11px 12px;border-radius:14px;
  background:var(--surface2);border:1px solid transparent;
  transition:transform .12s ease,border-color .2s ease;
}
.drill:active{transform:scale(.99)}
.drill .dl{flex:1;min-width:0}
.drill .dl .t{display:block;font-weight:800;font-size:15px}
.drill .dl .s{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.drill .dv{text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
.drill .dv .a{display:block;font-size:17px;font-weight:800;line-height:1.1}
.drill .dv .p{display:block;font-size:11px;color:var(--muted);font-weight:600}
.drill .chev{color:var(--dim);font-size:22px;line-height:1;flex:0 0 auto;margin-left:2px}
.drill.day .dl .t{font-size:14px}
/* A distance nothing reaches yet: the row still holds its place in the list,
   so the ladder reads as a ladder rather than a list that stops early. */
.drill.pb-none{opacity:.5}
.drill.pb-none .dv .a{font-size:17px;color:var(--dim)}
.tagh{
  display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;
  font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(94,168,255,.14);color:var(--recovery);border:1px solid rgba(94,168,255,.32);
}
/* ---------- strength ---------- */
.run.str{background:rgba(94,168,255,.06);border-color:rgba(94,168,255,.16)}
.run.str .dot{background:var(--recovery);opacity:.45}
.run.str.done .dot{background:var(--recovery);opacity:1}
.run.str .day{color:var(--recovery)}
.run.xt{background:rgba(255,176,58,.05);border-color:rgba(255,176,58,.14)}
.run.xt .dot{background:var(--warn);opacity:.4}
.run.xt.done .dot{background:var(--warn);opacity:1}
.run.xt .day{color:var(--warn)}
.req{
  display:inline-block;margin-left:5px;padding:1px 6px;border-radius:999px;
  font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,176,58,.16);color:var(--warn);border:1px solid rgba(255,176,58,.34);
}
.strd{color:var(--warn);font-weight:700}
.mets em.strd{color:var(--warn)}
.mets em.strd i{color:rgba(255,176,58,.7)}
.strhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.strcount{font-size:13px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.stritem{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:60px;padding:11px 12px;border-radius:14px;margin-bottom:8px;
  background:var(--surface2);border:1.5px solid var(--line);
}
.stritem.on{border-color:var(--accent);background:rgba(60,224,140,.07)}
.stritem .tick{
  flex:0 0 26px;height:26px;border-radius:8px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;color:#06210f;background:transparent;
}
.stritem.on .tick{background:var(--accent);border-color:var(--accent)}
.stritem .mid{flex:1;min-width:0}
.stritem .t{display:block;font-weight:700;font-size:15px}
.stritem .p{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.ty{
  display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;vertical-align:1px;
}
.ty.long{background:rgba(94,168,255,.15);color:var(--recovery);border:1px solid rgba(94,168,255,.32)}
.ty.tempo{background:rgba(255,176,58,.15);color:var(--warn);border:1px solid rgba(255,176,58,.34)}
.ty.race{background:rgba(255,95,95,.16);color:var(--danger);border:1px solid rgba(255,95,95,.38)}
.wknote{
  margin-top:12px;padding:9px 11px;border-radius:11px;font-size:13px;line-height:1.4;
  background:rgba(94,168,255,.08);border:1px solid rgba(94,168,255,.22);color:#c2ddff;
}
.prescr{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0}
.prescr span{
  padding:5px 10px;border-radius:9px;font-size:12.5px;font-weight:700;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);
}
/* The countdown strip. Deliberately quiet: it sits above the hero every day
   for 42 weeks, so it has to survive being looked at that often. */
.cd{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px;margin-bottom:12px;
}
.cdh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cdn{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdd{font-size:11.5px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.cdl{margin-top:7px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.cdl b{color:var(--text);font-size:17px;font-weight:800}
.cdbar{height:4px;border-radius:3px;background:var(--planned);overflow:hidden;margin-top:9px}
.cdbar>i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--accent-dim),var(--accent))}
.cdf{margin-top:7px;font-size:11.5px;color:var(--dim);font-weight:600}

/* The readiness verdict. Colour carries the reading, so it is legible before
   the sentence is. */
/* The morning card. Quiet by design — it is looked at every day for 42 weeks. */
.card.morning{border-color:rgba(94,168,255,.22)}
.mrn{
  margin-top:12px;padding:11px 13px;border-radius:12px;font-size:13.5px;line-height:1.45;
  background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--recovery);
  color:var(--muted);
}
.mrn b{color:var(--text)}
.mrn.high{background:rgba(255,176,58,.10);border-color:rgba(255,176,58,.38);
  border-left-color:var(--warn);color:#ffd699}
.mrn.high b{color:var(--warn)}

.verdict{
  margin-top:12px;padding:12px 14px;border-radius:13px;font-size:13.5px;line-height:1.45;
  background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--dim);
  color:var(--muted);
}
.verdict b{display:block;margin-bottom:3px;font-size:16px;color:var(--text)}
.verdict.on{border-left-color:var(--accent)}
.verdict.on b{color:var(--accent)}
.verdict.near{border-left-color:var(--recovery)}
.verdict.over,.verdict.behind{border-left-color:var(--warn)}
.verdict.over b,.verdict.behind b{color:var(--warn)}
.verdict.well-behind{border-left-color:var(--danger)}
.verdict.well-behind b{color:var(--danger)}
/* One pair in the rotation. */
.shoe{
  margin-top:12px;padding:13px 14px;border-radius:14px;
  background:var(--surface2);border:1px solid var(--line);
}
.shoe.near{border-color:rgba(255,176,58,.35)}
.shoe.over{border-color:rgba(255,95,95,.42)}
.shoe .btn-row .btn{min-height:38px;font-size:13px}

/* A one-off the plan asks for, and whether it has been done. */
.chk{
  display:flex;gap:11px;align-items:flex-start;margin-top:12px;padding:12px 14px;
  border-radius:13px;background:var(--surface2);border:1px solid var(--line);
  font-size:13.5px;line-height:1.45;color:var(--muted);
}
.chk b{display:block;margin-bottom:2px;font-size:14.5px;color:var(--text)}
.chk .tick{
  flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;margin-top:1px;
}
.chk.done{border-color:rgba(60,224,140,.3)}
.chk.done .tick{background:var(--accent);border-color:var(--accent);color:#06210f}
.chk.due{border-color:rgba(255,176,58,.4)}
.chk.due .tick{border-color:var(--warn)}
.chk.late{border-color:rgba(255,95,95,.45)}
.chk.late .tick{border-color:var(--danger)}
.lnk{
  display:inline-block;margin-left:8px;background:none;border:none;padding:0;
  color:var(--recovery);font-size:13px;font-weight:700;text-decoration:underline;
}
.phasebox{margin-top:12px;padding:12px 14px;border-radius:13px;
  background:rgba(94,168,255,.06);border:1px solid rgba(94,168,255,.18)}
.phasebox .pn{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--recovery)}
.phasebox .pf{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.pchk{margin-top:9px;font-size:13px;line-height:1.45;font-weight:600}
.pchk.ok{color:var(--accent)}
.pchk.warn{color:var(--warn)}

.phase{margin:18px 0 10px;padding:0 2px}
.phase:first-child{margin-top:2px}
.phase .pn{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.phase .pf{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.splitlist{display:flex;flex-wrap:wrap;gap:8px}
.sp{
  display:flex;flex-direction:column;align-items:center;min-width:62px;
  padding:8px 6px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);
}
.sp b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.sp i{font-style:normal;font-size:10px;color:var(--dim);font-weight:700;margin-top:2px;
  text-transform:uppercase;letter-spacing:.06em}
.sp.fast{border-color:rgba(60,224,140,.45)}
.sp.fast b{color:var(--accent)}
.sp.slow{border-color:rgba(255,176,58,.4)}
.sp.slow b{color:var(--warn)}
/* The part-kilometre a run finished on. Dashed, because it is not a split —
   it is a fraction, and must not be read against the whole ones beside it. */
.sp.tail{border-style:dashed;border-color:var(--line)}
.sp.tail b{color:var(--muted)}
.dotm{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:middle}
.dotm.rc{background:var(--recovery)}
.dotm.pk{background:var(--warn)}

.inputs{display:flex;gap:10px;align-items:flex-end}
.inp{flex:1}
.inp input{
  width:100%;min-height:var(--tap);border-radius:13px;border:1.5px solid var(--line);
  background:var(--surface2);padding:0 14px;font-size:22px;font-weight:700;
  font-variant-numeric:tabular-nums;text-align:center;
}
.inp input:focus{outline:none;border-color:var(--accent)}
.inp .u{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
/* Ten buttons across a phone. Small, but each still a real tap target, and
   the selected one takes a colour from the intensity it represents. */
.scale{display:flex;gap:4px}
.scale button{
  flex:1;min-width:0;height:46px;border-radius:10px;font-size:14px;font-weight:800;
  border:1.5px solid var(--line);background:var(--surface2);color:var(--text);
  font-variant-numeric:tabular-nums;padding:0;
}
.scale button.on{color:#06210f;border-color:transparent}
.scale button.on.r1,.scale button.on.r2,.scale button.on.r3{background:var(--easy)}
.scale button.on.r4,.scale button.on.r5,.scale button.on.r6{background:var(--moderate);color:#241500}
.scale button.on.r7,.scale button.on.r8{background:#ff8a3a;color:#2a1000}
.scale button.on.r9,.scale button.on.r10{background:var(--hard);color:#2a0000}
.seg.feel button{font-size:13px;padding:0 4px}
.seg.feel button.on{background:var(--recovery);color:#04203f;border-color:var(--recovery)}
.mets em.load{color:var(--recovery)}
.mets em.load i{color:rgba(94,168,255,.7)}
.fb{font-weight:800}
.fb.in{color:var(--accent)}
.fb.under{color:var(--warn)}
.fb.over{color:var(--recovery)}
.loadbands{display:flex;gap:6px;margin-top:12px}
.loadbands span{
  flex:1;text-align:center;padding:6px 2px;border-radius:8px;font-size:10.5px;font-weight:800;
  background:var(--surface2);border:1px solid var(--line);color:var(--dim);
  text-transform:uppercase;letter-spacing:.04em;
}
.loadbands span.on.low{background:rgba(94,168,255,.16);color:var(--recovery);border-color:rgba(94,168,255,.4)}
.loadbands span.on.ok{background:rgba(60,224,140,.16);color:var(--accent);border-color:rgba(60,224,140,.4)}
.loadbands span.on.climb{background:rgba(255,176,58,.15);color:var(--warn);border-color:rgba(255,176,58,.4)}
.loadbands span.on.spike{background:rgba(255,95,95,.15);color:var(--danger);border-color:rgba(255,95,95,.42)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{
  min-height:46px;padding:0 15px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface2);font-weight:600;font-size:15px;
}
.chips button.on{background:var(--danger);color:#2a0000;border-color:var(--danger);font-weight:800}
/* Conditions are not pain, so they must not borrow its red. */
.chips.cond button.on{background:rgba(60,224,140,.13);color:var(--accent);
  border-color:rgba(60,224,140,.5);font-weight:800}
.inp input.txt{text-align:left;font-size:15px;font-weight:600}
.cond-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cond-line span{
  background:var(--surface2);border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--muted);
}
.notebox{
  margin-top:12px;padding:12px 14px;border-radius:13px;background:var(--surface2);
  border:1px solid var(--line);border-left:3px solid var(--dim);
  font-size:14.5px;line-height:1.45;white-space:pre-wrap;
}
.run .nt{color:var(--dim);font-size:11px;font-weight:700;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch{margin:12px 0 4px}
.srch input{
  width:100%;min-height:46px;padding:0 14px;border-radius:12px;font-size:15px;font-weight:600;
  border:1.5px solid var(--line);background:var(--surface2);color:var(--text);
  -webkit-appearance:none;appearance:none;
}
.srch input:focus{outline:none;border-color:var(--accent)}
.srch input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;
  height:18px;width:18px;border-radius:50%;background:var(--line)}
textarea{
  width:100%;min-height:88px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--surface2);padding:12px 14px;font-size:16px;resize:vertical;
}
textarea:focus{outline:none;border-color:var(--accent)}
.pace{
  text-align:center;font-size:14px;color:var(--muted);margin-top:-6px;margin-bottom:14px;
  font-variant-numeric:tabular-nums;min-height:20px;
}
.pace b{color:var(--accent);font-size:16px}
.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}

/* ---------- import preview ---------- */
.imp{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 12px;border-radius:13px;background:var(--surface2);
  border:1.5px solid transparent;margin-bottom:8px;
}
.imp.on{border-color:var(--accent)}
.imp.conflict{border-color:var(--warn)}
.imp .tick{
  width:24px;height:24px;border-radius:7px;flex:0 0 auto;
  border:2px solid var(--dim);display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;color:#06210f;
}
.imp.on .tick{background:var(--accent);border-color:var(--accent)}
.imp .mid{flex:1;min-width:0}
.imp .a{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.imp .b{font-size:12px;color:var(--muted);margin-top:2px}
.imp .b.warnt{color:var(--warn)}
.imp .b.badt{color:var(--danger)}
.drop{
  border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;
  color:var(--muted);font-size:14px;margin-bottom:12px;
}
.drop.over{border-color:var(--accent);color:var(--accent)}
.tiny{font-size:12px;color:var(--dim);line-height:1.5;margin-top:10px}
</style>
</head>

/* Strength work: twice a week, 20-25 minutes, after a run. It is the

var KEY = "runplan.v1";

/* Every run carries an id, and logs are stored against that id rather than

function freshPlan(){
  var out = [], n = 0;

    out.push({
      start: p.s,
      tag: p.t,
      phase: p.p,
      note: p.n || null,
      runs: p.r.map(function(x){
        var o = x[3] || {};
        var r = { id:"r" + (++n), off:x[0], km:x[1], type:x[2] };
        if (o.cap) r.cap = o.cap;
        if (o.tempo) r.tempo = o.tempo;
        if (o.mp) r.mp = o.mp;
        if (o.strides) r.strides = true;
        return r;
      }),
      strength: STRENGTH_OFFSETS.map(function(off){ return { id:"s" + (++n), off:off }; }),
      cross: XT_OFFSETS.map(function(off){ return { id:"x" + (++n), off:off }; })

      Array.isArray(w.runs) && w.runs.every(function(r){

/* v1 stored weekStarts[] parallel to a hardcoded plan, and logs keyed "w-d".

function migrateV1(s){

  if (!planOK(s.plan)){ s = migrateV1(s); s.migrated = true; }
  if (!s.settings || typeof s.settings !== "object") s.settings = {};
  if (typeof s.planId !== "string") s.planId = planOK(s.plan) ? "legacy" : PLAN_ID;

  if (!(s.settings.hrRest > 0)) s.settings.hrRest = 55;

  // session, so none of it reaches the distance maths or the volume guards.

function crossDate(w, i){ return addDays(weekStart(w), crossOf(w)[i].off); }
function getCross(w, i){
  var x = crossOf(w)[i];
  return x ? (state.cross[x.id] || null) : null;
}
function setCross(w, i, v){ state.cross[crossOf(w)[i].id] = v; }
function crossDayName(w, i){ return WD_SHORT[crossOf(w)[i].off]; }
function crossRequired(w){ return (wk(w).phase || 1) >= XT_MANDATORY_PHASE; }
function crossTotals(){
  var done = 0, required = 0, mins = 0;
  for (var w = 0; w < planLen(); w++){
    var req = crossRequired(w);
    crossOf(w).forEach(function(x, i){
      if (req) required++;
      var l = getCross(w, i);
      if (l && l.done){ done++; mins += (l.mins || 0); }
    });
  }
  return { done: done, required: required, mins: mins };
}

function lastRunDate(w){
  var rs = runsOf(w), mx = 6;
  if (rs.length) mx = rs.reduce(function(a, r){ return Math.max(a, r.off); }, 0);
  return addDays(weekStart(w), mx);
}

/* ============================ DERIVED ============================ */
function weekActual(w){
  var sum = 0;
  runsOf(w).forEach(function(r, d){
    var l = getLog(w, d);
    if (l && l.done && typeof l.km === "number") sum += l.km;
  });
  return sum;
}
function weekIsPast(w){
  return dayDiff(lastRunDate(w), today()) > 0;     // after the week's final run
}
function weekIsCurrent(w){
  var t = today(), start = weekStart(w);
  return dayDiff(start, t) >= 0 && dayDiff(t, addDays(start, 6)) >= 0;
}
function currentWeekIndex(){
  for (var w = 0; w < planLen(); w++) if (weekIsCurrent(w)) return w;
  // before the plan starts -> week 1; after it ends -> last week
  if (dayDiff(today(), weekStart(0)) > 0) return 0;
  return planLen() - 1;
}
/* Next run that has not been logged either way */
function nextRun(){
  var t = today();
  for (var w = 0; w < planLen(); w++){
    for (var d = 0; d < runsOf(w).length; d++){
      var l = getLog(w, d);
      if (l && (l.done || l.skipped)) continue;
      if (dayDiff(t, runDate(w, d)) >= 0) return { w:w, d:d };   // today or later
    }
  }
  return null;
}
function rolling4(){
  var c = currentWeekIndex(), a = 0, p = 0;
  for (var w = Math.max(0, c-3); w <= c; w++){ a += weekActual(w); p += weekTotal(w); }
  return { actual:a, planned:p };
}
/* Consecutive completed runs, walking backwards from the last run due */
function streak(){
  var t = today(), slots = [];
  for (var w = 0; w < planLen(); w++)
    for (var d = 0; d < runsOf(w).length; d++)
      if (dayDiff(t, runDate(w, d)) <= 0) slots.push([w, d]);    // already due
  var n = 0;
  for (var i = slots.length - 1; i >= 0; i--){
    var l = getLog(slots[i][0], slots[i][1]);
    if (l && l.done) n++; else break;
  }
  return n;
}
/* Areas with >= 2 pain logs inside the trailing 14 days */
function painFlags(){
  var t = today(), byArea = {};
  Object.keys(state.logs).forEach(function(k){
    var l = state.logs[k];
    if (!l || !l.pain || !l.pain.area || !l.date) return;
    if (dayDiff(parseISO(l.date), t) > PAIN_WINDOW_DAYS) return;   // older than the window
    if (dayDiff(t, parseISO(l.date)) > 0) return;                  // logged ahead of today
    (byArea[l.pain.area] = byArea[l.pain.area] || []).push(l);
  });
  return Object.keys(byArea).filter(function(a){ return byArea[a].length >= 2; })
    .map(function(a){ return { area:a, count:byArea[a].length }; });
}
/* A fully past week with nothing completed */
function missedWeek(){
  for (var w = 0; w < planLen(); w++){
    if (!weekIsPast(w)) return null;               // stop at the first non-past week
    if (!runsOf(w).length) continue;               // an empty week cannot be missed
    var any = false;
    for (var d = 0; d < runsOf(w).length; d++){ var l = getLog(w, d); if (l && l.done) { any = true; break; } }
    if (!any) return w;
  }
  return null;
}
function overWeeks(){
  var out = [];
  for (var w = 0; w < planLen(); w++){
    var a = weekActual(w), p = weekTotal(w);
    if (p > 0 && a > p * OVER_LIMIT) out.push({ w:w, actual:a, planned:p });
  }
  return out;
}
function paceStr(km, sec){
  if (!km || !sec) return "";
  var s = Math.round(sec / km), m = Math.floor(s / 60), r = s % 60;
  return m + ":" + (r < 10 ? "0" : "") + r + " /km";
}
function durStr(sec){
  if (!sec) return "";
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h) return h + ":" + (m<10?"0":"") + m + ":" + (s<10?"0":"") + s;
  return m + ":" + (s<10?"0":"") + s;
}
/* ---------- splits ---------- */
/* Accepts "5:02 4:58 5:10", commas, or raw seconds. Returns sec/km. */
function parseSplits(s){
  if (!s) return null;
  var out = String(s).split(/[,;\s]+/).filter(Boolean).map(function(p){
    if (p.indexOf(":") >= 0){
      var q = p.split(":").map(Number);
      if (q.length === 3) return q[0]*3600 + q[1]*60 + q[2];
      if (q.length === 2 && isFinite(q[0]) && isFinite(q[1])) return q[0]*60 + q[1];
      return NaN;
    }
    return parseFloat(p);
  }).filter(function(v){ return isFinite(v) && v > 60 && v < 1800; });
  return out.length ? out : null;
}
function splitStr(sec){
  var m = Math.floor(sec/60), r = Math.round(sec%60);
  if (r === 60){ m++; r = 0; }
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function splitsToText(a){
  return a ? a.map(splitStr).join(" ") : "";
}
/* ---------- the kilometre the run ended part-way through ----------
   The watch reports a trailing partial lap — 5.4 km comes back as six laps,
   the last one 400 m. This app's split list is whole kilometres, so that tail
   was dropped on the way in and the last 400 m of the run had nowhere to show.

   It needs no storing. Distance, duration and the whole-km splits already
   imply it exactly, which also means it works for splits typed by hand, not
   only for imports. Kept out of the splits array on purpose: a 400 m split is
   not comparable with a 1 km one, and letting it into the list would hand
   "fastest split" to whatever fraction the run happened to finish on. */
function tailOf(l){
  if (!l || !l.done || !l.splits || !l.splits.length) return null;
  var n = l.splits.length, km = (l.km || 0) - n;
  km = Math.round(km * 100) / 100;
  // Under a full kilometre, or the splits are simply incomplete rather than
  // whole-km — an 8 km run with three splits typed has no tail, it has a gap.
  if (!(km >= 0.05 && km < 1)) return null;
  var sec = (l.durSec || 0) - l.splits.reduce(function(a, b){ return a + b; }, 0);
  if (!(sec > 0)) return null;                    // the two disagree; say nothing
  var pace = sec / km;
  if (!(pace > 60) || pace > 1800) return null;   // same sanity band as parseSplits
  return { km:km, sec:Math.round(sec), pace:pace };
}
/* ---------- conditions ---------- */
/* Built from the draft, and null when nothing was filled in, so an untouched
   run does not carry an empty object around forever. */
function draftCond(){
  var t = parseFloat(draft.temp);
  var c = {};
  if (draft.weather) c.weather = draft.weather;
  if (draft.surface) c.surface = draft.surface;
  if (isFinite(t) && t > -60 && t < 60) c.tempC = Math.round(t * 10) / 10;
  if (draft.route && String(draft.route).trim()) c.route = String(draft.route).trim();
  return Object.keys(c).length ? c : null;
}
/* The parts of a run's conditions worth showing, in reading order. */
function condBits(l){
  var c = l && l.cond, out = [];
  if (!c) return out;
  if (c.weather) out.push(c.weather);
  if (typeof c.tempC === "number") out.push(n1(c.tempC) + "\u00b0C");
  if (c.surface) out.push(c.surface);
  if (c.route) out.push(c.route);
  return out;
}
/* Everything about a run that is words rather than numbers, lowercased for
   matching. Fed by the search box in the time browser. */
function searchText(l){
  var parts = [l.note || "", l.date || ""];
  var c = l.cond;
  if (c) parts.push(c.weather || "", c.surface || "", c.route || "",
                    typeof c.tempC === "number" ? c.tempC + "c" : "");
  if (l.pain && l.pain.area) parts.push(l.pain.area, l.pain.note || "");
  if (l.effort) parts.push(l.effort);
  return parts.join(" ").toLowerCase();
}

/* The tail as a chip, matching the split chips but marked apart from them. */
function tailChipHTML(t){
  return '<span class="sp tail"><b>' + splitStr(t.sec) + '</b><i>last ' +
    n1(t.km) + ' km</i></span>';
}

/* ---------- the pre-phase-2 check ---------- */
/* The first week of the first phase past the base one. */
function phase2Week(){
  for (var w = 0; w < planLen(); w++) if ((wk(w).phase || 1) >= 2) return w;
  return -1;
}
function doctorCheck(){ return state.checks.doctor || null; }
function doctorState(){
  var w = phase2Week();
  if (w < 0) return null;                          // no second phase to prepare for
  var start = weekStart(w), t = today();
  var days = dayDiff(t, start);
  var rec = doctorCheck();
  return {
    week: w + 1, start: start, days: days,
    done: !!(rec && rec.done), rec: rec,
    // Worth raising a few weeks out, and worth raising more loudly once the
    // phase it was meant to precede has already begun.
    due: days <= DOCTOR_WARN_WEEKS * 7,
    overdue: days < 0
  };
}

/* ---------- fuelling ---------- */
function fuelApplies(w, d){
  var r = runAt(w, d);
  if (!r) return false;
  return isLong(w, d) && (wk(w).phase || 1) >= FUEL_PHASE && (r.km || 0) >= FUEL_MIN_KM;
}
/* The first week the practice is asked for, so the app can say where it starts. */
function fuelFromWeek(){
  for (var w = 0; w < planLen(); w++)
    for (var d = 0; d < runsOf(w).length; d++)
      if (fuelApplies(w, d)) return w + 1;
  return 0;
}
/* Grams per hour is what the plan prescribes, but total grams is what you
   actually know — three gels is a number you can count, 47 g/hr is not. So the
   total is entered and the rate derived from the run's own duration. */
function fuelRate(l){
  if (!l || !l.fuel || !(l.fuel.carbG > 0) || !(l.durSec > 0)) return null;
  var hours = l.durSec / 3600;
  if (!(hours > 0.25)) return null;                 // too short for a rate to mean anything
  return Math.round(l.fuel.carbG / hours);
}
function fuelBand(gPerHr){
  if (gPerHr === null) return null;
  if (gPerHr < FUEL_TARGET_LO) return { k:"under", t:"under the plan\u2019s " +
    FUEL_TARGET_LO + "\u2013" + FUEL_TARGET_HI + " g/hr" };
  if (gPerHr <= FUEL_TARGET_HI) return { k:"in", t:"inside the plan\u2019s " +
    FUEL_TARGET_LO + "\u2013" + FUEL_TARGET_HI + " g/hr" };
  return { k:"over", t:"above the plan\u2019s " + FUEL_TARGET_LO + "\u2013" +
    FUEL_TARGET_HI + " g/hr" };
}
function gutLabel(v){
  var g = GUT_SCALE.filter(function(x){ return x.v === v; })[0];
  return g ? g.t : null;
}
/* Every long run that asked for fuelling, and what was taken on it. */
function fuelSessions(){
  var out = [];
  for (var w = 0; w < planLen(); w++)
    for (var d = 0; d < runsOf(w).length; d++){
      if (!fuelApplies(w, d)) continue;
      var l = getLog(w, d);
      out.push({ w:w, d:d, log:l, date:toISO(runDate(w, d)),
                 done: !!(l && l.done), rate: l ? fuelRate(l) : null });
    }
  return out;
}

/* ---------- training load ----------
   Load is RPE x minutes, in arbitrary units, which is the standard session-RPE
   figure. Its value here is that it is the same unit for a run, a swim and
   twenty minutes of calf raises, so the three can finally be added up. */
function rpeOf(l, kind){
  if (!l) return null;
  if (l.rpe >= 1 && l.rpe <= 10) return l.rpe;
  if (kind === "run" && l.effort && RPE_FROM_EFFORT[l.effort]) return RPE_FROM_EFFORT[l.effort];
  return kind === "run" ? null : RPE_DEFAULT_OTHER;
}
function rpeIsEstimated(l){ return !(l && l.rpe >= 1 && l.rpe <= 10); }

/* Every completed session with a date, a duration and a load. Runs, cross
   training and strength together — the point of the exercise. */
function sessionLoads(){
  var out = [];
  var add = function(l, kind, mins){
    if (!l || !l.done || !l.date || !(mins > 0)) return;
    var r = rpeOf(l, kind);
    if (!(r > 0)) return;
    out.push({ date:l.date, kind:kind, mins:mins, rpe:r,
               load:Math.round(r * mins), estimated:rpeIsEstimated(l) });
  };
  Object.keys(state.logs).forEach(function(k){
    var l = state.logs[k];
    if (l && l.done) add(l, "run", (l.durSec || 0) / 60);
  });
  extraLogs().forEach(function(l){ add(l, "run", (l.durSec || 0) / 60); });
  Object.keys(state.cross).forEach(function(k){
    var c = state.cross[k]; if (c) add(c, "cross", c.mins || 0);
  });
  Object.keys(state.strength).forEach(function(k){
    var st = state.strength[k]; if (st) add(st, "strength", st.mins || 0);
  });
  return out.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
}
/* Total load in the window ending on `to`, `days` long and inclusive of it. */
function loadBetween(sessions, to, days){
  var from = toISO(addDays(parseISO(to), -(days - 1)));
  var sum = 0, n = 0, est = 0;
  sessions.forEach(function(x){
    if (x.date >= from && x.date <= to){ sum += x.load; n++; if (x.estimated) est++; }
  });
  return { load:sum, sessions:n, estimated:est };
}
/* Acute against chronic: this week's load against the weekly average of the
   last four. A ratio near 1 means this week looks like the recent normal. */
function loadRatio(){
  var sessions = sessionLoads();
  if (!sessions.length) return null;
  var to = toISO(today());
  var acute = loadBetween(sessions, to, ACUTE_DAYS);
  var chronicWin = loadBetween(sessions, to, CHRONIC_DAYS);
  var chronic = chronicWin.load / (CHRONIC_DAYS / ACUTE_DAYS);   // per acute-length week

  // Before there is four weeks of history behind it the ratio is comparing a
  // week against itself, which always reads about 1 and means nothing.
  var first = sessions[0].date;
  var span = dayDiff(parseISO(first), parseISO(to)) + 1;
  var settled = span >= CHRONIC_DAYS;

  return {
    acute:acute.load, chronic:Math.round(chronic),
    ratio: chronic > 0 ? Math.round(acute.load / chronic * 100) / 100 : null,
    sessions:acute.sessions, estimated:chronicWin.estimated,
    totalSessions:chronicWin.sessions, settled:settled, days:span
  };
}
function loadBand(r){
  if (r === null) return { k:"none", t:"Not enough to compare against yet." };
  if (r < 0.8)  return { k:"low",   t:"Lighter than the recent normal \u2014 a recovery week, or a week that slipped." };
  if (r <= 1.3) return { k:"ok",    t:"In step with the last four weeks." };
  if (r <= 1.5) return { k:"climb", t:"Climbing faster than the recent normal. Worth a look at what is planned next." };
  return { k:"spike", t:"A long way above the recent normal. This is the shape of week that tends to precede an injury." };
}
/* Load by plan week, for the chart. */
function weeklyLoads(){
  var sessions = sessionLoads(), out = [];
  for (var w = 0; w < planLen(); w++){
    var a = toISO(weekStart(w)), b = toISO(addDays(weekStart(w), 6)), sum = 0;
    sessions.forEach(function(x){ if (x.date >= a && x.date <= b) sum += x.load; });
    out.push({ w:w, load:sum });
  }
  return out;
}

/* ---------- morning readings ----------
   Kept apart from the logs: a weight or a night's sleep is not a session, and
   none of it may reach weekly distance, the 110% warning or a recovery week. */
function dayRec(iso){ return state.daily[iso] || null; }
function setDay(iso, rec){
  if (rec && (rec.rhr || rec.sleepH || rec.kg)) state.daily[iso] = rec;
  else delete state.daily[iso];                    // an emptied day is no day
  _rhrIdx = null;
}
/* Every date with a reading, oldest first. */
function dailyDates(){ return Object.keys(state.daily).sort(); }
function dailySeries(key){
  var out = [];
  dailyDates().forEach(function(d){
    var v = state.daily[d][key];
    if (typeof v === "number" && v > 0) out.push({ date:d, v:v });
  });
  return out;
}

/* Resting heart rate as it stood on a given day — the most recent reading on
   or before that date. Built once and cached, because vo2for() asks for it
   for every run on every render, and rebuilding the index each time would
   make that quadratic. save() clears the cache. */
var _rhrIdx = null;
function rhrIndex(){
  if (!_rhrIdx) _rhrIdx = dailySeries("rhr");
  return _rhrIdx;
}
function rhrOn(iso){
  var a = rhrIndex(), lo = 0, hi = a.length - 1, best = null;
  while (lo <= hi){                                 // last entry with date <= iso
    var mid = (lo + hi) >> 1;
    if (a[mid].date <= iso){ best = a[mid].v; lo = mid + 1; }
    else hi = mid - 1;
  }
  return best;
}
/* The mean of the readings in the window before (and not including) a date.
   Your own baseline, not a population one — the number that matters is the
   change from where you normally sit. */
function rhrBaseline(iso){
  var a = rhrIndex(), from = toISO(addDays(parseISO(iso), -RHR_BASELINE_DAYS));
  var vals = a.filter(function(x){ return x.date >= from && x.date < iso; })
               .map(function(x){ return x.v; });
  if (vals.length < RHR_MIN_BASELINE) return null;  // not enough to call it a baseline
  return Math.round(vals.reduce(function(p, q){ return p + q; }, 0) / vals.length * 10) / 10;
}
/* Today's reading against that baseline, when both exist. */
function rhrFlag(iso){
  var rec = dayRec(iso);
  if (!rec || !(rec.rhr > 0)) return null;
  var base = rhrBaseline(iso);
  if (base === null) return null;
  var delta = Math.round((rec.rhr - base) * 10) / 10;
  return { rhr:rec.rhr, base:base, delta:delta, high:delta >= RHR_FLAG_ABOVE };
}

/* ---------- VO2 max estimate ----------
   Pace -> oxygen cost (ACSM/Daniels running equation), then scaled by heart
   rate reserve, since %HRreserve tracks %VO2reserve closely. This is an
   estimate from your own run, not a reading off the watch — Samsung does not
   expose its number to third-party apps. */
function vo2for(l){
  if (!l || !l.done || !(l.km > 0) || !(l.durSec > 0) || !(l.hr > 0)) return null;
  var st = state.settings;
  /* Resting heart rate as it was on the day of the run, falling back to the
     setting when there is no reading that old.

     This used to read the single settings figure for every run, which meant
     the whole historical trend was scaled by whatever the setting said today:
     correcting a stale 55 down to 48 silently lifted every VO2 the app had
     ever shown. Over a 42-week base build the resting rate is supposed to
     fall, so the value has to travel with the run rather than with the app. */
  var rest = rhrOn(l.date || "") || st.hrRest;
  if (!(st.hrMax > rest)) return null;
  var v = (l.km * 1000) / (l.durSec / 60);                      // metres per minute
  if (!(v > 60) || v > 500) return null;
  var cost = -4.60 + 0.182258 * v + 0.000104 * v * v;           // ml/kg/min at that pace
  var frac = (l.hr - rest) / (st.hrMax - rest);                 // heart rate reserve
  if (!(frac > 0.4) || frac > 1.05) return null;                // too easy or over max to be meaningful
  return Math.round(((cost - 3.5) / frac + 3.5) * 10) / 10;
}
/* ---------- runs outside the plan ----------
   History imported from before the block started, or anything run alongside it.
   These sit in state.extras rather than state.logs because they answer to no
   plan slot, and because the plan-adherence machinery must not see them: a run
   from last year should not count towards this week's volume, trip the 110%
   warning, or make a recovery week look overshot. They do count towards
   everything that is simply a record of running — monthly totals, lifetime
   distance, the VO2 trend and average heart rate. */
function extraLogs(){
  return state.extras.filter(function(l){ return l && l.done; });
}
/* Every completed run, plan or not. Sorted by date. */
function allLogs(){
  var out = [];
  Object.keys(state.logs).forEach(function(k){
    var l = state.logs[k]; if (l && l.done) out.push(l);
  });
  extraLogs().forEach(function(l){ out.push(l); });
  return out.sort(function(a, b){ return (a.date || "") < (b.date || "") ? -1 : 1; });
}

/* Oldest first */
function vo2Series(){
  var out = [];
  allLogs().forEach(function(l){
    var v = vo2for(l);
    if (v) out.push({ date:l.date, vo2:v });
  });
  return out.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
}
function avgHR(){
  var hrs = [];
  allLogs().forEach(function(l){ if (l.hr > 0) hrs.push(l.hr); });
  return hrs.length ? Math.round(hrs.reduce(function(a, b){ return a+b; }, 0) / hrs.length) : null;
}

/* ---------- personal bests ----------
   The ladder is in real race distances, not in whole splits: a mile is 1.609
   km and the half is 21.0975, and rounding those to the nearest kilometre
   would mean measuring 21 km and calling it a half marathon. Reading across
   the splits (see bestWindowKm) is what makes the true distances available. */
var MILE_KM = 1.609344;
var PB_DISTANCES = [
  { km:1,            label:"1 km" },
  { km:MILE_KM,      label:"1 mile" },
  { km:MILE_KM * 2,  label:"2 miles" },
  { km:5,            label:"5 km" },
  { km:10,           label:"10 km" },
  { km:21.0975,      label:"Half marathon" },
  { km:42.195,       label:"Marathon" }
];

/* Fastest continuous stretch of W kilometres inside a run, read from its
   splits.

   For a whole number of kilometres this is simply the best run of consecutive
   splits, and exact. For a distance that lands between kilometre marks — every
   mile distance, and the true half and full marathon — the pace inside each
   kilometre is taken as even, which makes cumulative time a straight line
   between marks and the window time a piecewise-linear function of where the
   window starts.

   Such a function always takes its minimum at one of its corners, and the
   corners are exactly the kilometre marks plus the points one window-width
   before them. So checking those two families finds the true best of the
   model, rather than sampling along the run and hoping to land near it. */
function bestWindowKm(splits, W){
  if (!splits || !splits.length || !(W > 0)) return null;
  var n = splits.length, EPS = 1e-9;
  if (W > n + EPS) return null;                    // the run never went that far

  var cum = [0], i;
  for (i = 0; i < n; i++) cum.push(cum[i] + splits[i]);
  var timeAt = function(x){                        // elapsed time at x km
    if (x <= 0) return 0;
    if (x >= n) return cum[n];
    var k = Math.floor(x);
    return cum[k] + splits[k] * (x - k);
  };

  var best = null, starts = [], j;
  for (j = 0; j <= n; j++){ starts.push(j); starts.push(j - W); }
  starts.forEach(function(x){
    if (x < -EPS || x + W > n + EPS) return;       // window falls off the run
    x = Math.max(0, x);
    var t = timeAt(x + W) - timeAt(x);
    if (best === null || t < best) best = t;
  });
  return best;
}

/* The best effort over a distance, from two kinds of evidence: a window of
   consecutive splits, and a whole run that happens to be about that far.

   Candidates are ranked on pace, not on elapsed time. Their distances are not
   identical — a 42.2 km race and the best 42 km inside it are different
   lengths — and ranking on time would hand the record to whichever candidate
   was shortest rather than whichever was fastest. Every row reports the exact
   distance its time covers, so nothing is quietly rounded into a claim. */
function pbAt(km, ents){
  var best = null;
  var take = function(c){
    if (!c || !(c.km > 0) || !(c.sec > 0)) return;
    c.pace = c.sec / c.km;
    if (!best || c.pace < best.pace) best = c;
  };
  ents.forEach(function(e){
    var l = e.log;
    var w = bestWindowKm(l.splits, km);
    if (w) take({ sec:Math.round(w), km:km, e:e, from:"splits" });
    /* A run barely past the distance is that distance run; 15% past is a
       different session, and its pace would not be a record of anything.

       The half-percent of slack underneath is for GPS rather than generosity:
       a measured half marathon comes back from a watch as 21.05 or 21.08 km
       often as not, and refusing to count an actual race because the satellites
       cut the tangents would be precision in the wrong direction. Nothing is
       overstated by it — the row reports the distance the watch recorded, and
       ranking is on pace, so a slightly short run gets no advantage. */
    if (l.km >= km * 0.995 && l.km < km * 1.15 && l.durSec > 0)
      take({ sec:l.durSec, km:Math.round(l.km * 100) / 100, e:e, from:"run" });
  });
  return best;
}
function pbSourceText(c){
  var runKm = c.e.log.km || 0;
  if (c.from === "splits" && runKm > c.km + 0.15)
    return "inside a " + n1(runKm) + " km run";
  if (c.from === "run" && Math.abs(runKm - c.km) < 0.01 && runKm !== Math.round(runKm))
    return "whole run, " + n1(runKm) + " km";
  return "whole run";
}

/* Bests that are not a single run: volume over a calendar week or month, and
   the best VO2 estimate. Calendar weeks, not plan weeks, so history counts. */
function volumeBests(ents){
  var byW = {}, byM = {}, longest = null, vo2 = null;
  ents.forEach(function(e){
    var l = e.log;
    var wk2 = mondayISO(l.date), mo = l.date.slice(0, 7);
    (byW[wk2] = byW[wk2] || { km:0, runs:0 }); byW[wk2].km += l.km || 0; byW[wk2].runs++;
    (byM[mo] = byM[mo] || { km:0, runs:0 }); byM[mo].km += l.km || 0; byM[mo].runs++;
    if (!longest || (l.km || 0) > longest.log.km) longest = e;
    var v = vo2for(l);
    if (v && (!vo2 || v > vo2.v)) vo2 = { v:v, e:e };
  });
  var top = function(by, key){
    var bk = null;
    Object.keys(by).forEach(function(k){ if (!bk || by[k][key] > by[bk][key]) bk = k; });
    return bk ? { key:bk, km:by[bk].km, runs:by[bk].runs } : null;
  };
  return {
    week: top(byW, "km"), month: top(byM, "km"),
    busiest: top(byW, "runs"), longest: longest, vo2: vo2
  };
}

/* ---------- readiness ----------
   Whether the block is actually being run, measured only against what has
   already come due. Counting unrun future weeks as failures would say nothing
   except that the plan is long. */
function readiness(){
  var t = today(), r = {
    due:0, done:0, skipped:0, plannedKm:0, actualKm:0,
    longDue:0, longDone:0, hardInBase:0
  };
  for (var w = 0; w < planLen(); w++){
    var basePhase = (wk(w).phase || 1) === 1;
    for (var d = 0; d < runsOf(w).length; d++){
      if (dayDiff(t, runDate(w, d)) > 0) continue;       // not due yet
      var l = getLog(w, d), long = isLong(w, d);
      r.due++; r.plannedKm += runAt(w, d).km || 0;
      if (long) r.longDue++;
      if (l && l.done){
        r.done++; r.actualKm += l.km || 0;
        if (long) r.longDone++;
        if (basePhase && l.effort === "hard") r.hardInBase++;
      } else if (l && l.skipped) r.skipped++;
    }
  }
  r.completion = r.due ? r.done / r.due : null;
  r.adherence  = r.plannedKm > 0 ? r.actualKm / r.plannedKm : null;
  r.r4 = rolling4();
  r.phase = phaseOf(currentWeekIndex());
  r.crossDue = 0; r.crossDone = 0;
  for (var w2 = 0; w2 < planLen(); w2++){
    if (!crossRequired(w2)) continue;                    // optional through the base phase
    for (var i = 0; i < crossOf(w2).length; i++){
      if (dayDiff(t, crossDate(w2, i)) > 0) continue;
      r.crossDue++;
      var c = getCross(w2, i);
      if (c && c.done) r.crossDone++;
    }
  }
  return r;
}
/* One verdict, from adherence first and completion second. Volume is what the
   plan is actually built on; a week of three half-length runs is three ticks
   and not the week that was planned. */
function readinessVerdict(r){
  if (!r.due) return { k:"none", t:"Not started", s:"Nothing has come due yet." };
  var a = r.adherence, c = r.completion;
  if (a > 1.10)
    return { k:"over", t:"Ahead of plan",
             s:"You are running " + Math.round(a*100) + "% of what was planned. " +
               "That is the fastest way to lose a block this long." };
  if (a >= 0.95 && c >= 0.9)
    return { k:"on", t:"On plan", s:"Volume and run count are both where they should be." };
  if (a >= 0.85)
    return { k:"near", t:"Just under plan",
             s:Math.round(a*100) + "% of the planned volume so far. Close enough to hold." };
  if (a >= 0.7)
    return { k:"behind", t:"Behind plan",
             s:Math.round(a*100) + "% of the planned volume, " + r.done + " of " + r.due +
               " runs done. Worth rebuilding from where you are rather than catching up." };
  return { k:"well-behind", t:"Well behind plan",
           s:Math.round(a*100) + "% of the planned volume. Shifting the remaining weeks " +
             "back beats trying to rejoin at a volume you have not built to." };
}
/* What this phase asks that the volume numbers do not. */
function phaseCheck(r){
  if (!r.phase) return null;
  if (r.phase.n === 1)
    return r.hardInBase
      ? { k:"warn", t:r.hardInBase + " run" + (r.hardInBase === 1 ? "" : "s") +
            " logged hard in the base phase. This phase is all easy \u2014 no speed work." }
      : { k:"ok", t:"Nothing logged hard yet, which is what the base phase asks for." };
  if (r.phase.n === 2){
    if (!r.crossDue) return { k:"ok", t:"Cross-training becomes mandatory this phase." };
    var f = r.crossDone / r.crossDue;
    return f >= 0.8
      ? { k:"ok", t:"Cross-training " + r.crossDone + " of " + r.crossDue + " done, as required." }
      : { k:"warn", t:"Cross-training is mandatory this phase and " + r.crossDone +
            " of " + r.crossDue + " sessions are done." };
  }
  if (r.phase.n === 3){
    if (!r.longDue) return null;
    var lf = r.longDone / r.longDue;
    return lf >= 0.85
      ? { k:"ok", t:"Long runs " + r.longDone + " of " + r.longDue +
            " done. They are what this phase turns on." }
      : { k:"warn", t:"Only " + r.longDone + " of " + r.longDue + " long runs done. " +
            "Everything else in this phase matters less than these." };
  }
  return { k:"ok", t:"Volume comes down now. The taper is meant to feel wrong." };
}

/* ---------- race day ----------
   Where the block is heading, rather than where it has been.

   Read from the plan, not from RACE_DATE, so that editing the plan moves race
   day with it. The last run typed "race" is the target; the half-marathon
   tune-up in week 33 is also a race, which is why this walks backwards. */
function raceTarget(){
  var w, d;
  for (w = planLen() - 1; w >= 0; w--)
    for (d = runsOf(w).length - 1; d >= 0; d--)
      if (runAt(w, d).type === "race")
        return { w:w, d:d, km:runAt(w, d).km, date:runDate(w, d) };
  // No race typed in the plan: the last run of the last week is the finish line.
  w = planLen() - 1; d = runsOf(w).length - 1;
  return d >= 0 ? { w:w, d:d, km:runAt(w, d).km, date:runDate(w, d) } : null;
}

/* Riegel: T2 = T1 x (D2/D1)^1.06. The standard endurance projection, and the
   one every race-time calculator is built on. */
var RIEGEL_EXP = 1.06;
function riegel(sec, fromKm, toKm){
  return sec * Math.pow(toKm / fromKm, RIEGEL_EXP);
}

/* Daniels' curve for the fraction of VO2 max that is sustainable for a given
   number of minutes. Racing an hour sits near 0.97 of it; a marathon, some
   three and a half hours, near 0.81. */
function sustainableFraction(min){
  return 0.8 + 0.1894393 * Math.exp(-0.012778 * min)
             + 0.2989558 * Math.exp(-0.1932605 * min);
}
/* The app's own VO2 equation, run backwards: given an oxygen cost, the speed
   that produces it. Solving 0.000104v^2 + 0.182258v - 4.60 = cost for v. */
function velocityForCost(cost){
  var a = 0.000104, b = 0.182258, c = -4.60 - cost;
  var disc = b*b - 4*a*c;
  if (disc <= 0) return null;
  return (-b + Math.sqrt(disc)) / (2*a);            // metres per minute
}
/* Finish time from a VO2 max estimate. The sustainable fraction depends on how
   long the race lasts, which depends on the fraction, so it is iterated —
   from a marathon-ish starting guess it settles within a few rounds. */
function predictFromVO2(vo2, km){
  if (!(vo2 > 20) || !(km > 0)) return null;
  var t = 210, i, v, nt;
  for (i = 0; i < 12; i++){
    v = velocityForCost(sustainableFraction(t) * vo2);
    if (!v || v < 60 || v > 500) return null;
    nt = (km * 1000) / v;
    if (Math.abs(nt - t) < 0.02){ t = nt; break; }
    t = nt;
  }
  return Math.round(t * 60);
}
/* The VO2 estimate to predict from: the best of the recent ones, since a
   figure from eight months ago describes a different runner. */
function currentVO2(){
  var vs = vo2Series(), t = today(), recent = [], all = [];
  vs.forEach(function(x){
    all.push(x.vo2);
    if (dayDiff(parseISO(x.date), t) <= 56) recent.push(x.vo2);
  });
  var pool = recent.length ? recent : all;
  return pool.length ? Math.max.apply(null, pool) : null;
}

/* One projection per distance there is a best for. Keeping them all rather
   than collapsing to a single number is the point: a wide spread means the
   evidence disagrees, and that is worth seeing before trusting any of it. */
function racePredictions(){
  var target = raceTarget();
  if (!target || !(target.km > 0)) return null;
  var ents = allEntries().filter(function(e){ return e.log.durSec > 0; });

  var from = [];
  PB_DISTANCES.forEach(function(D){
    var c = pbAt(D.km, ents);
    if (c) from.push({ km:c.km, sec:c.sec, e:c.e, label:D.label,
                       proj:Math.round(riegel(c.sec, c.km, target.km)) });
  });

  var vo2 = currentVO2();
  var vProj = vo2 ? predictFromVO2(vo2, target.km) : null;

  // The longest distance with a record is the one to lead with. Projecting a
  // marathon from a single fast kilometre is arithmetic, not evidence.
  var best = null;
  from.forEach(function(f){ if (!best || f.km > best.km) best = f; });

  var all = from.map(function(f){ return f.proj; });
  if (vProj) all.push(vProj);
  if (!all.length) return null;

  return {
    target: target, from: from, vo2: vo2, vo2Proj: vProj,
    lead: best ? best.proj : vProj,
    leadFrom: best,
    lo: Math.min.apply(null, all), hi: Math.max.apply(null, all),
    // Confidence is a question about the evidence, not about the runner: how
    // far the longest genuine effort actually went.
    evidenceKm: best ? best.km : 0
  };
}
/* Thresholds sit clear of the landmarks rather than on them: a half marathon
   is exactly half a marathon, and a cut at 0.5 would grade it by rounding. */
function predictionConfidence(km, targetKm){
  var f = targetKm > 0 ? km / targetKm : 0;
  if (f >= 0.65) return { k:"good",  t:"well evidenced" };   // 30 km into a marathon
  if (f >= 0.45) return { k:"fair",  t:"reasonably evidenced" };   // a half
  if (f >= 0.20) return { k:"early", t:"early days" };        // a 10 km
  return { k:"raw", t:"very early \u2014 treat as a placeholder" };
}

/* ---------- period breakdowns ----------
   One summariser, fed either a week's slots or a calendar month's logs, so
   the two tables cannot drift apart in how they count things. */
function summarise(logs){
  var km = 0, sec = 0, n = 0, hrs = [], vs = [], skip = 0, kcal = 0;
  logs.forEach(function(l){
    if (!l) return;
    if (l.skipped){ skip++; return; }
    if (!l.done) return;
    n++; km += (l.km || 0); sec += (l.durSec || 0); kcal += (l.kcal || 0);
    if (l.hr > 0) hrs.push(l.hr);
    var v = vo2for(l); if (v) vs.push(v);
  });
  return {
    runs:n, km:km, sec:sec, skipped:skip, kcal:kcal,
    hr: hrs.length ? Math.round(hrs.reduce(function(a,b){ return a+b; }, 0) / hrs.length) : null,
    vo2: vs.length ? Math.max.apply(null, vs) : null
  };
}
function weekRows(){
  var out = [];
  for (var w = 0; w < planLen(); w++){
    var ls = runsOf(w).map(function(r, d){ return getLog(w, d); });
    var s = summarise(ls);
    s.w = w; s.planned = weekTotal(w); s.tag = wk(w).tag;
    s.start = weekStart(w); s.end = addDays(weekStart(w), 6);
    out.push(s);
  }
  return out;
}
/* Planned km per calendar month, from where each run actually falls. */
function monthPlanned(){
  var by = {};
  for (var w = 0; w < planLen(); w++)
    runsOf(w).forEach(function(r, d){
      var m = toISO(runDate(w, d)).slice(0, 7);
      by[m] = (by[m] || 0) + (r.km || 0);
    });
  return by;
}
function allEntries(){
  var out = [];
  for (var w = 0; w < planLen(); w++)
    for (var d = 0; d < runsOf(w).length; d++){
      var l = getLog(w, d);
      if (l && l.done && l.date) out.push({ log:l, w:w, d:d, extra:false });
    }
  state.extras.forEach(function(l, i){
    if (l && l.done && l.date) out.push({ log:l, idx:i, extra:true });
  });
  return out.sort(function(a, b){
    return a.log.date < b.log.date ? -1 : a.log.date > b.log.date ? 1 : 0;
  });
}
/* Weeks run Monday to Sunday here, independent of the plan's own weeks, so a
   run from before the block still lands in one. */
function mondayISO(iso){ return toISO(mondayOf(parseISO(iso))); }

function monthLabel(ym){
  var p = ym.split("-");
  return new Date(+p[0], +p[1]-1, 1).toLocaleDateString(undefined, { month:"long", year:"numeric" });
}
function weekLabel(mon){
  var a = parseISO(mon);
  return fmtDate(a) + " \u2013 " + fmtDate(addDays(a, 6));
}
function groupBy(entries, keyOf){
  var keys = [], by = {};
  entries.forEach(function(e){
    var k = keyOf(e);
    if (!by[k]){ by[k] = []; keys.push(k); }
    by[k].push(e);
  });
  return { keys: keys.sort(), by: by };
}

/* Longest run and best VO2 are period questions, so they live here rather than
   in summarise(), which is shared with the plan tables. */
function periodExtras(logs){
  var longest = 0, vo2 = null;
  logs.forEach(function(l){
    if ((l.km || 0) > longest) longest = l.km || 0;
    var v = vo2for(l);
    if (v && (vo2 === null || v > vo2)) vo2 = v;
  });
  return { longest: longest, vo2: vo2 };
}

function periodStatsHTML(logs){
  var r = summarise(logs), x = periodExtras(logs);
  var bits = [];
  bits.push('<em>' + n1(r.km) + ' <i>km</i></em>');
  bits.push('<em>' + r.runs + ' <i>run' + (r.runs === 1 ? '' : 's') + '</i></em>');
  if (r.sec) bits.push('<em>' + durStr(r.sec) + '</em>');
  if (r.km && r.sec) bits.push('<em>' + paceStr(r.km, r.sec).replace(" /km", "") + ' <i>/km</i></em>');
  if (r.hr) bits.push('<em>' + r.hr + ' <i>bpm</i></em>');
  if (r.kcal) bits.push('<em>' + r.kcal + ' <i>kcal</i></em>');
  if (x.longest) bits.push('<em>' + n1(x.longest) + ' <i>longest</i></em>');
  if (x.vo2) bits.push('<em>' + x.vo2 + ' <i>best VO&#8322;</i></em>');
  if (r.skipped) bits.push('<em class="over">' + r.skipped + ' <i>skipped</i></em>');
  return '<div class="mets">' + bits.join("") + '</div>';
}

function drillRow(act, label, sub, logs){
  var r = summarise(logs);
  return '<button class="drill" ' + act + '>' +
    '<span class="dl"><span class="t">' + esc(label) + '</span>' +
    (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</span>' +
    '<span class="dv"><span class="a">' + n1(r.km) + '</span>' +
    '<span class="p">km &middot; ' + r.runs + ' run' + (r.runs === 1 ? '' : 's') + '</span></span>' +
    '<span class="chev">&rsaquo;</span></button>';
}

var browse = { level:"years", y:null, m:null, wk:null, q:"" };

/* The card is the shell; everything inside it is redrawn on its own so typing
   in the search box does not re-render the page and take the keyboard with it. */
function browseHTML(){
  var ents = allEntries();
  var h = '<div class="card" style="margin-top:12px"><div class="label">Browse by time</div>';

  if (!ents.length){
    return h + '<div class="empty" style="padding:20px 8px">Log or import a run and it ' +
           'appears here, grouped by year, month and week.</div></div>';
  }
  return h +
    '<div class="srch"><input id="run-search" type="search" autocomplete="off" ' +
      'placeholder="Search notes, route, weather, pain\u2026" value="' + esc(browse.q || "") + '"></div>' +
    '<div id="browse-body">' + browseBodyHTML(ents) + '</div></div>';
}

function browseBodyHTML(ents){
  var h = "";
  if (browse.q && browse.q.trim()) return searchResultsHTML(ents, browse.q.trim());

  // Breadcrumb — every level above the current one is a way back.
  var crumbs = ['<button class="crumb" data-lvl="years">All time</button>'];
  if (browse.level !== "years")
    crumbs.push('<button class="crumb" data-lvl="year" data-y="' + browse.y + '">' + browse.y + '</button>');
  if (browse.level === "month" || browse.level === "week")
    crumbs.push('<button class="crumb" data-lvl="month" data-m="' + browse.m + '">' +
                esc(monthLabel(browse.m)) + '</button>');
  if (browse.level === "week")
    crumbs.push('<button class="crumb on">' + esc(weekLabel(browse.wk)) + '</button>');
  h += '<div class="crumbs">' + crumbs.join('<span class="sep">&rsaquo;</span>') + '</div>';

  var sel, g, i;

  if (browse.level === "years"){
    g = groupBy(ents, function(e){ return e.log.date.slice(0, 4); });
    h += periodStatsHTML(ents.map(function(e){ return e.log; }));
    h += '<div class="drills">';
    for (i = g.keys.length - 1; i >= 0; i--){
      var yk = g.keys[i], yl = g.by[yk].map(function(e){ return e.log; });
      var mk = groupBy(g.by[yk], function(e){ return e.log.date.slice(0, 7); }).keys.length;
      h += drillRow('data-lvl="year" data-y="' + yk + '"', yk,
                    mk + ' month' + (mk === 1 ? '' : 's'), yl);
    }
    h += '</div>';

  } else if (browse.level === "year"){
    sel = ents.filter(function(e){ return e.log.date.slice(0, 4) === browse.y; });
    g = groupBy(sel, function(e){ return e.log.date.slice(0, 7); });
    h += periodStatsHTML(sel.map(function(e){ return e.log; }));
    var planned = monthPlanned();
    h += '<div class="drills">';
    for (i = g.keys.length - 1; i >= 0; i--){
      var mkey = g.keys[i], ml = g.by[mkey].map(function(e){ return e.log; });
      var pk = planned[mkey] || 0;
      h += drillRow('data-lvl="month" data-m="' + mkey + '"',
                    monthLabel(mkey).replace(" " + browse.y, ""),
                    pk ? n1(pk) + " km planned" : null, ml);
    }
    h += '</div>';

  } else if (browse.level === "month"){
    sel = ents.filter(function(e){ return e.log.date.slice(0, 7) === browse.m; });
    h += periodStatsHTML(sel.map(function(e){ return e.log; }));
    // A week can straddle two months. The row and the week it opens must agree,
    // so both cover the whole Monday-to-Sunday week, and straddling is flagged.
    var mons = [], seen = {};
    sel.forEach(function(e){
      var mo = mondayISO(e.log.date);
      if (!seen[mo]){ seen[mo] = true; mons.push(mo); }
    });
    mons.sort();
    h += '<div class="drills">';
    for (i = mons.length - 1; i >= 0; i--){
      var mo2 = mons[i];
      var wl = ents.filter(function(e){ return mondayISO(e.log.date) === mo2; });
      var spans = wl.some(function(e){ return e.log.date.slice(0, 7) !== browse.m; });
      h += drillRow('data-lvl="week" data-wk="' + mo2 + '"', weekLabel(mo2),
                    spans ? "spans two months" : null,
                    wl.map(function(e){ return e.log; }));
    }
    h += '</div>';

  } else {
    sel = ents.filter(function(e){ return mondayISO(e.log.date) === browse.wk; });
    h += periodStatsHTML(sel.map(function(e){ return e.log; }));
    h += '<div class="drills">' + sel.map(runDrillHTML).join("") +
         '</div><div class="tiny">Tap a run to open it.</div>';
  }

  return h;
}

/* One run as a row. Shared by the week level and by search, so the two cannot
   drift apart in what they show. */
function runDrillHTML(e, withDate){
  var l = e.log, dt = parseISO(l.date);
  var mets = [];
  if (l.durSec) mets.push('<em>' + durStr(l.durSec) + '</em>');
  if (l.km && l.durSec) mets.push('<em>' + paceStr(l.km, l.durSec).replace(" /km","") + ' <i>/km</i></em>');
  if (l.hr) mets.push('<em>' + l.hr + ' <i>bpm</i></em>');
  if (l.kcal) mets.push('<em>' + l.kcal + ' <i>kcal</i></em>');
  var v = vo2for(l);
  if (v) mets.push('<em>' + v + ' <i>VO&#8322;</i></em>');
  if (l.splits && l.splits.length) mets.push('<em>' + l.splits.length + ' <i>splits</i></em>');
  var cb = condBits(l);
  var label = dt.toLocaleDateString(undefined,
    withDate ? { weekday:"short", year:"numeric", month:"short", day:"numeric" }
             : { weekday:"long", month:"short", day:"numeric" });
  return '<button class="drill day" ' +
    (e.extra ? 'data-openx="' + e.idx + '"' : 'data-open="' + e.w + ',' + e.d + '"') + '>' +
    '<span class="dl"><span class="t">' + label +
      (e.extra ? ' <span class="tagh">history</span>' : '') + '</span>' +
    '<span class="mets">' + mets.join("") + '</span>' +
    ((cb.length || l.note)
      ? '<span class="s">' + esc(cb.concat(l.note ? [l.note] : []).join(" \u00b7 ")) + '</span>'
      : '') + '</span>' +
    '<span class="dv"><span class="a">' + n1(l.km) + '</span><span class="p">km</span></span>' +
    '<span class="chev">&rsaquo;</span></button>';
}

/* Search across everything a run carries in words — the note, the route, the
   weather, the surface, where it hurt, the date. Runs are the only thing worth
   searching: a week has no words of its own. */
function searchResultsHTML(ents, q){
  var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  var hits = ents.filter(function(e){
    var hay = searchText(e.log);
    return terms.every(function(t){ return hay.indexOf(t) >= 0; });
  }).reverse();                                  // newest first, unlike the drill-down

  if (!hits.length)
    return '<div class="empty" style="padding:26px 8px">Nothing matches ' +
           '&ldquo;' + esc(q) + '&rdquo;.</div>';

  return periodStatsHTML(hits.map(function(e){ return e.log; })) +
    '<div class="drills">' +
      hits.map(function(e){ return runDrillHTML(e, true); }).join("") +
    '</div><div class="tiny">' + hits.length + ' run' + (hits.length === 1 ? '' : 's') +
    ' matching &ldquo;' + esc(q) + '&rdquo;. Clear the box to go back to browsing.</div>';
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function n1(x){ return (Math.round(x * 10) / 10).toString(); }
/* 12,400 kcal will not fit a stat tile; 12.4k will. */
function fmtK(x){
  return x >= 10000 ? (Math.round(x / 100) / 10) + "k" : String(Math.round(x));
}

/* ============================ PLAN EDITS ============================
   Every one of these can move runs between positions. None of them touch
   log keys, because logs are stored against run ids — see freshPlan.
   ==================================================================== */

/* Move week w (and every week after it) so w starts on the next Monday. */
/* The plan lives on the device, so a new one in the source does not reach an
   existing install by itself. Adopting it replaces the plan — but every run
   already logged is moved to history first, so switching plans cannot cost you
   a run you actually did. */
function planIsCurrent(){ return state.planId === PLAN_ID; }

/* ---------- changing the plan without losing what you have done ----------

   Logs key on run ids, which is what makes editing a plan safe. Replacing one
   is different: the new plan's runs are new objects with new ids, so every log
   would orphan, and the old behaviour was to sweep them all into history —
   safe, but it emptied the week table, the streak and every adherence figure
   of a block you had actually run.

   A date is the thing that survives a plan change. A run done on 25 August is
   still a run done on 25 August whatever the new plan calls that day, so logs
   are re-pointed onto whichever run in the new plan falls on their date. Only
   what genuinely has no home goes to history. */
var REATTACH_DAYS = 3;          // the window the importer already uses to pair a run

/* Dates for every session in a plan array, without needing it installed. */
function planSlots(plan, key){
  var out = [];
  plan.forEach(function(wk2, w){
    (wk2[key] || []).forEach(function(r, d){
      out.push({ w:w, d:d, id:r.id,
                 date: toISO(addDays(parseISO(wk2.start), r.off || 0)) });
    });
  });
  return out.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
}
/* The free slot nearest a date, exact match first. Entries are matched in date
   order so that an earlier run cannot be displaced by a later one reaching
   back for the same slot. */
function nearestSlot(slots, taken, date, windowDays){
  var best = null, bestGap = Infinity;
  for (var i = 0; i < slots.length; i++){
    if (taken[slots[i].id]) continue;
    var gap = Math.abs(dayDiff(parseISO(date), parseISO(slots[i].date)));
    if (gap > windowDays) continue;
    if (gap < bestGap){ best = slots[i]; bestGap = gap; }
    if (gap === 0) break;                      // nothing beats the same day
  }
  return best;
}

/* Work out where everything lands, without changing anything. The preview and
   the commit run the same function, so what you are shown is what happens. */
function planTransfer(newPlan, opts){
  opts = opts || {};
  var res = { logs:{}, strength:{}, cross:{}, extras:[],
              matched:0, rescued:0, toHistory:0, strengthKept:0, crossKept:0 };

  var gather = function(store, plan, key){
    var out = [];
    if (plan){
      plan.forEach(function(wk2, w){
