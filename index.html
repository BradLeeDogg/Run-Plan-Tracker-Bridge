function wireDrop(){
  var dz = document.getElementById("drop");
  if (!dz) return;
  ["dragenter","dragover"].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove("over"); });
  });
  dz.addEventListener("drop", function(e){
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });
}

/* ---------- large files ----------
   A full Apple Health export is the whole history of every sensor the phone
   has, and routinely runs past a gigabyte. Reading that with readAsText builds
   one enormous string and the tab is killed long before parsing starts, so a
   Health export is walked in slices instead and only its <Workout> blocks are
   kept — a few hundred bytes each, and the only part this app wants.

   Decoding uses TextDecoder in streaming mode because a slice boundary can
   fall inside a multi-byte character; decoding each slice independently would
   corrupt it. Any partial workout left at the end of a slice is carried into
   the next one. */
var STREAM_THRESHOLD = 20 * 1024 * 1024;    // 20 MB — above this, do not slurp
var STREAM_CHUNK = 8 * 1024 * 1024;

function canStream(f){
  return typeof TextDecoder !== "undefined" && f && typeof f.slice === "function" &&
         typeof Blob !== "undefined" && typeof Blob.prototype.arrayBuffer === "function";
}

/* Reads the first slice only, to find out what we are dealing with. */
function peekFile(f){
  return f.slice(0, 64 * 1024).arrayBuffer().then(function(buf){
    return new TextDecoder("utf-8").decode(buf);
  });
}

/* Index of the last real <Workout ...> opening tag. Cannot be lastIndexOf,
   because "<Workout" is also a prefix of "<WorkoutStatistics" — cutting the
   buffer there splits a workout down the middle and loses it. */
function lastWorkoutStart(text){
  var re = /<Workout[\s>\/]/g, m, at = -1;
  while ((m = re.exec(text)) !== null) at = m.index;
  return at;
}

function streamHealthWorkouts(f, onProgress){
  var dec = new TextDecoder("utf-8");
  var acts = [], tail = "", pos = 0;
  var MAX_TAIL = 4 * 1024 * 1024;      // a workout is bytes, not megabytes

  function step(){
    if (pos >= f.size){
      if (tail) collect(tail);
      return Promise.resolve(acts);
    }
    var end = Math.min(pos + STREAM_CHUNK, f.size);
    return f.slice(pos, end).arrayBuffer().then(function(buf){
      var text = tail + dec.decode(buf, { stream: true });
      pos = end;

      // Take every complete block, then carry forward only what follows the
      // last one — which is at most a partial workout, so the tail stays small.
      // Anything already matched is spent and must never be re-scanned or
      // dropped: that is where duplicates and losses come from.
      var spent = scanWorkouts(text, function(a){ acts.push(a); });
      var rest = text.slice(spent);
      var open = lastWorkoutStart(rest);
      tail = (open === -1) ? rest.slice(-2048) : rest.slice(open);

      // Only reachable if a <Workout> never closes — malformed, not a run.
      if (tail.length > MAX_TAIL) tail = tail.slice(-2048);

      if (onProgress) onProgress(pos / f.size, acts.length);
      // Yield to the UI so the progress line actually paints.
      return new Promise(function(res){ setTimeout(res, 0); }).then(step);
    });
  }

  function collect(text){
    scanWorkouts(text, function(a){ acts.push(a); });
  }

  return step();
}

function readFile(f){
  // Small enough to read whole — every format, unchanged.
  if (!canStream(f) || f.size < STREAM_THRESHOLD){
    var fr = new FileReader();
    fr.onload = function(){ tryParse(String(fr.result)); };
    fr.onerror = function(){
      alert(f.size >= STREAM_THRESHOLD
        ? "That file is too large for this browser to read in one go."
        : "Could not read that file.");
    };
    fr.readAsText(f);
    return;
  }

  peekFile(f).then(function(head){
    if (!/<HealthData|HKWorkoutActivityType/i.test(head)){
      alert("That file is " + Math.round(f.size / 1048576) + " MB, which is too large to read " +
            "unless it is an Apple Health export.");
      return;
    }
    showScanning(0, 0);
    return streamHealthWorkouts(f, showScanning).then(function(acts){
      if (!acts.length){
        alert("No running workouts found in that Health export.");
        drawImport();
        return;
      }
      importRows = buildImportRows(acts);
      drawImport();
    });
  }).catch(function(err){
    alert("Could not read that file. " + (err && err.message ? err.message : ""));
  });
}

function showScanning(frac, found){
  sheet.innerHTML = '<div class="grab"></div><h2>Reading the export</h2>' +
    '<div class="sub">Health exports are large, so this is read in pieces. ' +
    'Keep the app open.</div>' +
    '<div class="bar" style="margin:18px 0 10px"><i style="width:' +
      Math.round(frac * 100) + '%"></i></div>' +
    '<div class="pace">' + Math.round(frac * 100) + '% &middot; <b>' + found +
    '</b> run' + (found === 1 ? '' : 's') + ' found so far</div>';
}

function tryParse(text){
  try {
    importRows = buildImportRows(parseActivities(text));
  } catch (err){
    alert(err && err.message ? err.message : "Could not read that.");
    return;
  }
  drawImport();
}

function applyImport(){
  var n = 0, x = 0;
  importRows.forEach(function(r){
    if (!r.on) return;
    if (r.extra){
      state.extras.push({
        id: newId(),
        done:true, skipped:false,
        km: Math.round(r.act.km * 100) / 100,
        durSec: r.act.sec || 0,
        hr: r.act.hr || null,
        kcal: r.act.kcal || null,
        splits: r.act.splits || null,
        effort: null,
        date: r.act.date, ts: Date.now(),
        imported: true, extra: true,
        pain: null,
        shoeId: defaultShoe() ? defaultShoe().id : null
      });
      x++;
      return;
    }
    var prev = getLog(r.slot.w, r.slot.d) || {};
    setLog(r.slot.w, r.slot.d, {
      done:true, skipped:false,
      km: Math.round(r.act.km * 100) / 100,
      durSec: r.act.sec || 0,
      hr: r.act.hr || null,
      kcal: r.act.kcal || prev.kcal || null,
      splits: r.act.splits || prev.splits || null,
      effort: prev.effort || null,        // not in the data — left for you to set
      date: r.act.date, ts: Date.now(),
      imported: true,
      // A file carries none of these, so what was written by hand survives it.
      pain: prev.pain || null,
      note: prev.note || null,
      cond: prev.cond || null,
      rpe: prev.rpe || null,
      feel: prev.feel || null,
      fuel: prev.fuel || null,
      // A file does not say what you wore, so the pair on record stands, and a
      // new import lands on whichever pair is currently default.
      shoeId: prev.shoeId || (defaultShoe() ? defaultShoe().id : null)
    });
    n++;
  });
  if (x) state.extras.sort(function(a, b){ return (a.date || "") < (b.date || "") ? -1 : 1; });
  save(); closeSheet(); render();
  var msg = [];
  if (n) msg.push(n + " onto the plan");
  if (x) msg.push(x + " as history");
  alert("Imported " + (n + x) + " run" + ((n + x) === 1 ? "" : "s") +
    (msg.length > 1 ? " — " + msg.join(", ") : "") + ".\n\n" +
    (n ? "Effort and pain are not in the file — tap any run to add them." :
         "History shows in the monthly table and the VO₂ trend."));
}

/* ============================ EVENTS ============================ */
document.addEventListener("click", function(e){
  var el;

  el = e.target.closest("[data-tab]");
  if (el){ tab = el.dataset.tab; render(); return; }

  el = e.target.closest("[data-xt]");
  if (el){
    var xp = el.dataset.xt.split(",");
    openCrossSheet(+xp[0], +xp[1]);
    return;
  }

  el = e.target.closest("[data-xt-kind]");
  if (el && xtDraft){
    var mel2 = document.getElementById("f-xtmin");
    if (mel2) xtDraft.mins = mel2.value === "" ? "" : parseInt(mel2.value, 10);
    xtDraft.kind = el.dataset.xtKind;
    drawCrossSheet();
    return;
  }

  el = e.target.closest("[data-str]");
  if (el){
    var sp = el.dataset.str.split(",");
    openStrengthSheet(+sp[0], +sp[1]);
    return;
  }

  el = e.target.closest("[data-str-item]");
  if (el && strDraft){
    var k = el.dataset.strItem;
    var mel = document.getElementById("f-strmin");
    if (mel) strDraft.mins = mel.value === "" ? "" : parseInt(mel.value, 10);
    strDraft.items[k] = !strDraft.items[k];
    drawStrengthSheet();
    return;
  }

  el = e.target.closest("[data-run]");
  if (el){
    var pr = el.dataset.run.split(",");
    openSheet(+pr[0], +pr[1]);
    return;
  }

  el = e.target.closest("[data-lvl]");
  if (el){
    browse.q = "";                      // drilling in means you are done searching
    browse.level = el.dataset.lvl;
    if (el.dataset.y) browse.y = el.dataset.y;
    if (el.dataset.m){ browse.m = el.dataset.m; browse.y = el.dataset.m.slice(0, 4); }
    if (el.dataset.wk){
      browse.wk = el.dataset.wk;
      browse.m = browse.m || el.dataset.wk.slice(0, 7);
      browse.y = el.dataset.wk.slice(0, 4);
    }
    render();
    var cb = document.querySelector(".crumbs");
    if (cb) cb.scrollIntoView({ block:"center" });
    return;
  }

  el = e.target.closest("[data-open]");
  if (el){
    var o = el.dataset.open.split(",");
    openSheet(+o[0], +o[1]);
    return;
  }

  el = e.target.closest("[data-openx]");
  if (el){ openExtraSheet(+el.dataset.openx); return; }

  el = e.target.closest("[data-bar]");
  if (el){
    var ro = document.getElementById("barReadout");
    if (ro) ro.innerHTML = barReadoutHTML(+el.dataset.bar);
    return;
  }

  el = e.target.closest("[data-toggle]");
  if (el){ el.parentNode.classList.toggle("open"); return; }

  el = e.target.closest("[data-field]");
  if (el){
    var f = el.dataset.field, v = el.dataset.v;
    // The same picker markup serves all three sheets, so it sets whichever
    // draft is open rather than assuming the run one.
    var D = draft || strDraft || xtDraft;
    if (!D) return;
    if (D === draft) readInputs();
    else {
      // keep the minutes box, which is not a data-field, from being lost
      var mEl = document.getElementById(D === strDraft ? "f-strmin" : "f-xtmin");
      if (mEl) D.mins = mEl.value === "" ? "" : parseInt(mEl.value, 10);
    }
    D[f] = (f === "painOn") ? (v === "1")
         : (el.dataset.toggleable && String(D[f]) === String(v)) ? null   // tap again to unset
         : v;
    if (f === "painOn" && !D.painOn){ D.area = null; D.painNote = ""; }
    if (D === draft) drawSheet();
    else if (D === strDraft) drawStrengthSheet();
    else drawCrossSheet();
    return;
  }

  el = e.target.closest("[data-act]");
  if (el){
    var a = el.dataset.act;
    if (a === "edit-run"){ draft.mode = "edit"; drawSheet(); return; }
    else if (a === "save")   saveDraft();
    else if (a === "cancel") closeSheet();
    else if (a === "clear"){
      delete state.logs[runAt(draft.w, draft.d).id];
      save(); closeSheet(); render();
    }
    else if (a === "adopt-plan") adoptNewPlan();
    else if (a === "strides-yes"){ state.settings.strides = true;  save(); render(); }
    else if (a === "strides-no"){  state.settings.strides = false; save(); render(); }
    else if (a === "shoe-add"){
      var nmA = window.prompt("Name for the new pair:", "Pair " + (state.shoes.length + 1));
      if (nmA === null) return;
      var kmA = window.prompt("Kilometres already on them, if any:", "0");
      if (kmA === null) return;
      addShoe(nmA.trim(), parseFloat(kmA));
    }
    else if (a === "shoe-retire"){
      var shR = shoeById(el.dataset.id);
      if (!shR) return;
      if (!confirm("Retire " + shR.name + " at " + n1(shoeKm(shR)) + " km?\n\n" +
          "Runs already logged against them keep their mileage. They stop being " +
          "offered when you log a run.")) return;
      retireShoe(shR.id);
    }
    else if (a === "shoe-unretire"){
      var shU = shoeById(el.dataset.id);
      if (!shU) return;
      shU.retired = null;
      save(); render();
    }
    else if (a === "shoe-default") setDefaultShoe(el.dataset.id);
    else if (a === "shoe-edit"){
      var sh2 = shoeById(el.dataset.id);
      if (!sh2) return;
      var nm2 = window.prompt("Name for this pair:", sh2.name);
      if (nm2 === null) return;
      var km2 = window.prompt("Kilometres already on them when first recorded:", String(sh2.startKm || 0));
      if (km2 === null) return;
      var v2 = parseFloat(km2);
      sh2.name = nm2.trim() || sh2.name;
      if (isFinite(v2) && v2 >= 0) sh2.startKm = Math.round(v2 * 10) / 10;
      save(); render();
    }
    else if (a === "xt-save") saveCross();
    else if (a === "xt-clear"){
      delete state.cross[crossOf(xtDraft.w)[xtDraft.i].id];
      save(); closeSheet(); render();
    }
    else if (a === "str-save") saveStrength();
    else if (a === "str-all"){
      var all = true;
      STRENGTH.forEach(function(x){ if (!strDraft.items[x.k]) all = false; });
      STRENGTH.forEach(function(x){ strDraft.items[x.k] = !all; });
      drawStrengthSheet();
    }
    else if (a === "str-clear"){
      delete state.strength[strengthOf(strDraft.w)[strDraft.i].id];
      save(); closeSheet(); render();
    }
    else if (a === "shift") shiftFrom(+el.dataset.w);
    /* ---- plan editing ---- */
    else if (a === "edit-week") openWeekSheet(+el.dataset.w);
    else if (a === "add-week") addWeek();
    else if (a === "del-week"){ closeSheet(); deleteWeek(+el.dataset.w); }
    else if (a === "set-tag"){ setWeekTag(+el.dataset.w, el.dataset.tag); drawWeekSheet(); }
    else if (a === "add-run"){ addRun(+el.dataset.w); drawWeekSheet(); }
    else if (a === "del-run"){ deleteRun(+el.dataset.w, +el.dataset.d); drawWeekSheet(); }
    else if (a === "nudge"){ nudgeWeek(+el.dataset.w, +el.dataset.n); drawWeekSheet(); }
    else if (a === "move-run"){
      var mw = +el.dataset.w, md = +el.dataset.d, id = runAt(mw, md).id;
      if (setRunDay(mw, md, +el.dataset.off) !== false){
        draft.d = indexOfRun(mw, id);       // sorting may have moved it
        drawSheet(); render();
      }
    }
    else if (a === "import-runs") openImport();
    else if (a === "pick-file") document.getElementById("fileIn").click();
    else if (a === "parse-text") tryParse(document.getElementById("imp-text").value);
    else if (a === "imp-row"){
      var row = importRows[+el.dataset.i];
      if (row.slot){ row.on = !row.on; drawImport(); }
    }
    else if (a === "apply-import") applyImport();
    else if (a === "doctor-done"){
      var when = window.prompt("Date of the check-up (YYYY-MM-DD):", toISO(today()));
      if (when === null) return;
      when = String(when).trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(when)){ alert("Use the form 2026-11-20."); return; }
      var nt = window.prompt("Anything worth keeping from it? (optional)", "");
      if (nt === null) nt = "";
      state.checks.doctor = { done:true, date:when, note:nt.trim() || null };
      save(); render();
    }
    else if (a === "doctor-undo"){
      delete state.checks.doctor;
      save(); render();
    }
    else if (a === "save-morning"){
      var num = function(id, lo, hi){
        var el = document.getElementById(id);
        if (!el || el.value === "") return null;
        var v = parseFloat(el.value);
        return (isFinite(v) && v >= lo && v <= hi) ? Math.round(v * 10) / 10 : null;
      };
      var rhrV = num("m-rhr", 25, 140), slV = num("m-sleep", 0, 16), kgV = num("m-kg", 30, 200);
      setDay(toISO(today()), { rhr:rhrV, sleepH:slV, kg:kgV });
      save(); render();
    }
    else if (a === "save-hr"){
      var mx = parseInt(document.getElementById("s-hrmax").value, 10);
      var rs = parseInt(document.getElementById("s-hrrest").value, 10);
      if (!(mx > 0) || !(rs > 0) || mx <= rs){
        alert("Max heart rate has to be above resting."); return;
      }
      state.settings.hrMax = mx; state.settings.hrRest = rs;
      save(); render();
    }
    else if (a === "del-extra-sheet"){
      state.extras.splice(+el.dataset.i, 1);
      save(); closeSheet(); render();
    }
    else if (a === "del-extra"){
      state.extras.splice(+el.dataset.i, 1);
      save(); render();
    }
    else if (a === "clear-extras"){
      if (!confirm("Remove all " + state.extras.length + " runs kept as history?\n\n" +
                   "Runs logged against the plan are not touched. This can be undone.")) return;
      snapshot("Remove " + state.extras.length + " history runs");
      state.extras = [];
      save(); render();
    }
    else if (a === "undo") doUndo();
    else if (a === "rescue-history") rescueHistory();
    else if (a === "export") doExport();
    else if (a === "copy")   doCopy();
    else if (a === "import") doImport();
    else if (a === "reset")  doReset();
    return;
  }
});

scrim.addEventListener("click", closeSheet);

document.getElementById("fileIn").addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0];
  if (f) readFile(f);
  e.target.value = "";        // so the same file can be picked again
});
/* Search redraws only the browse body. A full render would rebuild the input
   and hand the keyboard back to the page mid-word. */
document.getElementById("view").addEventListener("input", function(e){
  if (e.target.id !== "run-search") return;
  browse.q = e.target.value;
  var body = document.getElementById("browse-body");
  if (body) body.innerHTML = browseBodyHTML(allEntries());
});

sheet.addEventListener("input", function(e){
  if (/^f-(km|hours|min|sec|hr|kcal|splits|temp|carb)$/.test(e.target.id || "")){
    readInputs(); syncPace();
    return;
  }
  // live-edit a planned distance without redrawing, so the field keeps focus
  if (e.target.dataset && e.target.dataset.act === "set-km"){
    var v = parseFloat(e.target.value);
    if (isFinite(v) && v >= 0) setRunKm(+e.target.dataset.w, +e.target.dataset.d, v);
  }
});

sheet.addEventListener("change", function(e){
  var a = e.target.dataset ? e.target.dataset.act : null;
  if (a === "set-day"){
    setRunDay(+e.target.dataset.w, +e.target.dataset.d, +e.target.value);
    drawWeekSheet(); render();
  } else if (a === "set-km"){
    drawWeekSheet(); render();      // on blur, refresh the week total
  }
});

/* Re-render when the app comes back after midnight */
document.addEventListener("visibilitychange", function(){
  if (!document.hidden) render();
});

render();

if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
